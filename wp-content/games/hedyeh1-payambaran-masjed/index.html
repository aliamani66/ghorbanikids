<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خانه پاک خدا و پیامبر مهربانی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IRANSansXFaNum', 'IRANSansX', Tahoma, sans-serif; user-select: none; }
        body { background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .game-card { background: #ffffff; border-radius: 24px; box-shadow: 0 15px 35px rgba(109,40,217,0.15); width: 100%; max-width: 480px; padding: 20px; text-align: center; border: 3px solid #c4b5fd; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .badge { background: #ede9fe; color: #5b21b6; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; }
        .score-box { background: #6d28d9; color: #fff; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; }
        .quiz-box { background: #faf5ff; border: 3px dashed #a78bfa; border-radius: 20px; padding: 20px; margin: 16px 0; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .quiz-icon { font-size: 4rem; margin-bottom: 8px; }
        .quiz-text { font-size: 1.15rem; font-weight: 800; color: #4c1d95; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 16px; }
        .opt-btn { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 14px; font-size: 1rem; font-weight: 800; color: #1e293b; cursor: pointer; transition: all 0.15s; text-align: right; }
        .opt-btn:active { transform: scale(0.96); }
        .opt-btn.correct { background: #22c55e !important; color: #fff !important; border-color: #16a34a !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; border-color: #dc2626 !important; }
        .modal { display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; z-index: 10; }
        .btn-restart { background: linear-gradient(135deg, #6d28d9, #5b21b6); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🌸 هدیه‌ها: خانه خدا و پیامبر مهربانی</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <div class="quiz-box">
            <div class="quiz-icon" id="qzIcon">🕌</div>
            <div class="quiz-text" id="qzText">نام خانه پاک و باصفای خدا چیست؟</div>
        </div>

        <div class="options-grid" id="optionsContainer">
            <!-- Shuffled options -->
        </div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🕌🌸⭐</div>
            <h2 style="color:#5b21b6; font-size:1.6rem; font-weight:900;">آفرین نوگل باایمان!</h2>
            <p style="color:#475569; font-weight:700;">آموزه‌های درس هدیه‌های آسمان را عالی و کامل پاسخ دادی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(220, 'triangle', 0.25); }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        const pool = [
            {
                icon: '🕌',
                question: 'نام خانه باصفای خدا که در آن با جماعت نماز می‌خوانیم چیست؟',
                correct: 'مسجد 🕌',
                wrongs: ['مدرسه 🏫', 'کتابخانه 📚']
            },
            {
                icon: '🌸',
                question: 'نام پیامبر مهربان و دلسوز ما مسلمانان چیست؟',
                correct: 'حضرت محمد مصطفی (ص) 🌸',
                wrongs: ['حضرت ابراهیم (ع) 📜', 'حضرت نوح (ع) 🕊️']
            },
            {
                icon: '💧',
                question: 'قبل از خواندن نماز چه کار پاکیزه و زیبایی انجام می‌دهیم؟',
                correct: 'وضو می‌گیریم و آماده نماز می‌شویم 🚿',
                wrongs: ['کتاب داستان می‌خوانیم 📖', 'لباس ورزشی می‌پوشیم 🏃']
            },
            {
                icon: '📖',
                question: 'کتاب آسمانی، نورانی و راهنمای ما مسلمانان چیست؟',
                correct: 'قرآن کریم 📖✨',
                wrongs: ['دفتر نقاشی 🎨', 'کتاب سرود و ترانه 🎶']
            },
            {
                icon: '🤲',
                question: 'هنگام راز و نیاز و دعا با خدا، دست‌ها را چگونه قرار می‌دهیم؟',
                correct: 'دست‌ها را رو به آسمان بلند کرده و از خدا طلب خیر می‌کنیم 🤲',
                wrongs: ['دست‌ها را روی زانوها می‌گذاریم 🧘', 'دست‌ها را کنار بدن قرار می‌دهیم 🧍']
            },
            {
                icon: '🕋',
                question: 'خانه کعبه (قبله یکتای ما مسلمانان) در کدام شهر نورانی قرار دارد؟',
                correct: 'شهر مقدس مکه 🕋',
                wrongs: ['شهر مدینه منوره 🕌', 'شهر نجف اشرف 🏛️']
            }
        ];

        let gameQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const q = gameQuestions[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            document.getElementById('qzIcon').textContent = q.icon;
            document.getElementById('qzText').textContent = q.question;

            const options = shuffleArray([
                { text: q.correct, isCorrect: true },
                ...q.wrongs.map(w => ({ text: w, isCorrect: false }))
            ]);

            const cont = document.getElementById('optionsContainer');
            cont.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect, btn);
                cont.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, btn) {
            if(!canClick) return;
            canClick = false;

            if(isCorrect) {
                sndCorrect();
                btn.classList.add('correct');
                score += 15;
            } else {
                sndWrong();
                btn.classList.add('wrong');
            }

            setTimeout(() => {
                currentIdx++;
                if(currentIdx < gameQuestions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 600);
        }

        function endGame() {
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').style.display = 'flex';
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            score = 0;
            currentIdx = 0;
            gameQuestions = shuffleArray(pool).slice(0, 6);
            document.getElementById('endModal').style.display = 'none';
            loadQuestion();
        }

        restartGame();
    </script>
</body>
</html>
