<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قلعه ده‌تایی‌ها و یکی‌ها - ریاضی اول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(234,88,12,0.25); border: 4px solid #fed7aa; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #ffedd5; color: #c2410c; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .place-value-table { width: 100%; border-collapse: collapse; border: 3px solid #ea580c; border-radius: 16px; overflow: hidden; }
        .pv-th { background: #ea580c; color: #fff; font-size: 1.1rem; font-weight: 900; padding: 10px; text-align: center; }
        .pv-td { background: #fffaf5; padding: 16px 8px; text-align: center; border: 2px solid #fdba74; min-height: 90px; vertical-align: middle; }
        .bundle-wrap { display: flex; justify-content: center; align-items: center; gap: 4px; flex-wrap: wrap; }
        .ten-bundle { background: #f97316; color: #fff; font-weight: 900; font-size: 0.8rem; padding: 8px 12px; border-radius: 10px; border: 2px solid #c2410c; display: inline-flex; align-items: center; gap: 4px; }
        .one-cube { width: 22px; height: 22px; background: #38bdf8; border-radius: 6px; border: 2px solid #0284c7; display: inline-block; }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #fed7aa; border-radius: 18px; padding: 14px; font-size: 2rem; font-weight: 900; color: #7c2d12; cursor: pointer; text-align: center; transition: all 0.2s; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #ea580c, #c2410c); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🧮 ریاضی اول: جدول ارزش مکانی</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <p style="text-align:center; color:#9a3412; font-weight:800; font-size:1.05rem;">این بسته‌ها چه عددی را نشان می‌دهند؟</p>

        <table class="place-value-table">
            <thead>
                <tr>
                    <th class="pv-th" style="width:50%;">ده‌تایی</th>
                    <th class="pv-th" style="width:50%;">یکی</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="pv-td"><div class="bundle-wrap" id="tensBox"></div></td>
                    <td class="pv-td"><div class="bundle-wrap" id="onesBox"></div></td>
                </tr>
            </tbody>
        </table>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🏰⭐</div>
            <h2 style="color:#9a3412; font-size:1.6rem; font-weight:900;">استاد جدول ارزش مکانی!</h2>
            <p style="color:#475569; font-weight:700;">ده‌تایی‌ها و یکی‌ها را مثل یک نابغه حساب کردی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523.25, 'triangle', 0.15); setTimeout(()=>playTone(659.25, 'triangle', 0.25), 100); }
        function sndWrong() { playTone(190, 'sawtooth', 0.2); }
        function sndWin() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.25), i * 120)); }

        const questions = [
            { tens: 1, ones: 3, num: 13 },
            { tens: 1, ones: 6, num: 16 },
            { tens: 2, ones: 4, num: 24 },
            { tens: 1, ones: 8, num: 18 },
            { tens: 3, ones: 2, num: 32 },
            { tens: 2, ones: 7, num: 27 },
            { tens: 4, ones: 5, num: 45 },
            { tens: 1, ones: 9, num: 19 }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const q = questions[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);

            const tensBox = document.getElementById('tensBox');
            tensBox.innerHTML = '';
            for(let t=0; t<q.tens; t++) {
                const b = document.createElement('div');
                b.className = 'ten-bundle';
                b.innerHTML = `📦 ۱۰`;
                tensBox.appendChild(b);
            }

            const onesBox = document.getElementById('onesBox');
            onesBox.innerHTML = '';
            for(let o=0; o<q.ones; o++) {
                const c = document.createElement('div');
                c.className = 'one-cube';
                onesBox.appendChild(c);
            }

            let wrong = new Set();
            while(wrong.size < 2) {
                let r = q.num + (Math.random() > 0.5 ? 2 : -2) * (Math.floor(Math.random()*4)+1);
                if(r > 0 && r !== q.num) wrong.add(r);
            }
            let opts = [q.num, ...Array.from(wrong)].sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = toPersian(opt);
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const q = questions[currentIdx];

            if(chosen === q.num) {
                sndCorrect();
                btn.classList.add('correct');
                score += 12;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < questions.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
