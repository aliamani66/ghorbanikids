<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حرف گمشده</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      padding: 16px;
      touch-action: manipulation;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.02rem;
      font-weight: bold;
      color: #6b21a8;
      margin-bottom: 8px;
    }

    .score-badge {
      background: #f3e8ff;
      color: #7e22ce;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .lives-row {
      font-size: 1.4rem;
      margin-bottom: 12px;
      letter-spacing: 4px;
    }

    .image-box {
      background: #faf5ff;
      border: 3px dashed #d8b4fe;
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .word-emoji {
      font-size: 4.5rem;
      line-height: 1.1;
      display: block;
    }

    .word-slots-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 20px 0;
      direction: rtl;
      flex-wrap: wrap;
    }

    .char-box {
      font-size: 2rem;
      font-weight: 900;
      color: #3b0764;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blank-slot {
      width: 54px;
      height: 54px;
      border: 3px dashed #9333ea;
      background: #f5f3ff;
      border-radius: 14px;
      font-size: 1.8rem;
      font-weight: 900;
      color: #7e22ce;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .blank-slot.drag-over {
      background: #ddd6fe;
      transform: scale(1.1);
    }

    .blank-slot.filled-correct {
      background: #4ade80;
      border: 3px solid #16a34a;
      color: #064e3b;
      transform: scale(1.05);
    }

    .blank-slot.filled-reveal {
      background: #fed7aa;
      border: 3px solid #ea580c;
      color: #7c2d12;
    }

    .options-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 12px;
    }

    .letters-pool {
      display: flex;
      justify-content: center;
      gap: 10px;
      min-height: 65px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .letter-choice {
      width: 54px;
      height: 54px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      font-size: 1.7rem;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow: 0 4px 0 #94a3b8;
      transition: transform 0.1s, opacity 0.2s;
      touch-action: none;
      position: relative;
    }

    .letter-choice:active {
      cursor: grabbing;
    }

    .letter-choice.dragging {
      position: fixed;
      z-index: 999;
      pointer-events: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
      transform: scale(1.1) rotate(-3deg);
    }

    .letter-choice.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .letter-choice.used {
      visibility: hidden;
    }

    .message {
      font-size: 1.05rem;
      font-weight: bold;
      min-height: 28px;
      margin-top: 8px;
    }

    .game-over {
      padding: 10px 0 4px;
    }

    .game-over-emoji {
      font-size: 4rem;
      margin-bottom: 6px;
    }

    .game-over-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #6b21a8;
      margin-bottom: 10px;
    }

    .game-over-score {
      font-size: 1.15rem;
      font-weight: bold;
      color: #7e22ce;
      background: #f3e8ff;
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .replay-btn {
      display: block;
      margin: 0 auto;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      background: #9333ea;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      box-shadow: 0 4px 0 #6b21a8;
      cursor: pointer;
    }

    .replay-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #6b21a8;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="top-bar">
    <span>مرحله: <span id="lvl-num">۱</span> از <span id="lvl-total">۳۰</span></span>
    <div class="score-badge">امتیاز: <span id="score-val">۰</span> ⭐</div>
  </div>

  <div class="lives-row" id="lives-row"></div>

  <div class="image-box">
    <span class="word-emoji" id="word-emoji">🍎</span>
  </div>

  <div class="word-slots-container" id="word-container"></div>

  <div class="options-title" id="options-title">حرف مناسب را بکش یا رویش کلیک/لمس کن:</div>
  <div class="letters-pool" id="letters-pool"></div>

  <div class="message" id="message"></div>

  <div class="game-over" id="game-over" style="display:none;">
    <div class="game-over-emoji">🏆</div>
    <div class="game-over-title">آفرین! بازی تمام شد</div>
    <div class="game-over-score">امتیاز نهایی: <span id="final-score">۰</span> ⭐</div>
    <button class="replay-btn" id="replay-btn">بازی از اول 🔄</button>
  </div>
</div>

<script>
    // GhorbaniKids Score Submission Protocol
    function gkSendScore(finalScore) {
        try {
            var sc = parseInt(finalScore) || 0;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'GK_SUBMIT_SCORE',
                    score: sc
                }, '*');
            }
        } catch(e) { console.error('GK postMessage error:', e); }
    }
    
  // ---------- داده‌های ۳۰ کلمه ----------
  // b: اندیس حروف (۰-پایه) که باید جای خالی باشند. تعداد جای خالی متناسب با طول کلمه است:
  // ۳ تا ۴ حرف: ۱ جای خالی، ۵ تا ۶ حرف: ۲ جای خالی، ۷+ حرف: ۳ جای خالی.
  const WORDS = [
    { w: "انار",     e: "🍎", b: [1] },
    { w: "اردک",     e: "🦆", b: [2] },
    { w: "سیب",      e: "🍏", b: [1] },
    { w: "ماهی",     e: "🐟", b: [2] },
    { w: "خرگوش",    e: "🐰", b: [1, 3] },
    { w: "خورشید",   e: "☀️", b: [1, 4] },
    { w: "درخت",     e: "🌳", b: [2] },
    { w: "ستاره",    e: "⭐", b: [1, 3] },
    { w: "پروانه",   e: "🦋", b: [1, 4] },
    { w: "گوسفند",   e: "🐑", b: [1, 4] },
    { w: "کتاب",     e: "📚", b: [1] },
    { w: "مداد",     e: "✏️", b: [2] },
    { w: "توپ",      e: "⚽", b: [1] },
    { w: "خانه",     e: "🏠", b: [2] },
    { w: "مدرسه",    e: "🏫", b: [1, 3] },
    { w: "اتوبوس",   e: "🚌", b: [1, 4] },
    { w: "هواپیما",  e: "✈️", b: [1, 3, 5] },
    { w: "دوچرخه",   e: "🚲", b: [1, 4] },
    { w: "موز",      e: "🍌", b: [1] },
    { w: "پرتقال",   e: "🍊", b: [1, 4] },
    { w: "انگور",    e: "🍇", b: [1, 3] },
    { w: "هندوانه",  e: "🍉", b: [2, 3, 5] },
    { w: "گیتار",    e: "🎸", b: [1, 3] },
    { w: "ساعت",     e: "⏰", b: [2] },
    { w: "چتر",      e: "☂️", b: [1] },
    { w: "عینک",     e: "👓", b: [2] },
    { w: "کلاه",     e: "🎩", b: [1] },
    { w: "جوراب",    e: "🧦", b: [1, 3] },
    { w: "کفش",      e: "👟", b: [1] },
    { w: "پرنده",    e: "🐦", b: [1, 3] }
  ];

  const MAX_LIVES = 2;

  // حروفی که به حرف بعدی می‌چسبند (برای نمایش شکل اتصالی با تطویل "ـ")
  const CONNECTORS = new Set(['ب','پ','ت','ث','ج','چ','ح','خ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','ه','ی']);

  // حروف هم‌خانواده از نظر شکل، برای ساخت گزینه‌های مشابه (حواس‌پرت‌کن)
  const FAMILY = {
    'ب':['پ','ت','ث'], 'پ':['ب','ت','ث'], 'ت':['ب','پ','ث'], 'ث':['ب','پ','ت'],
    'ج':['چ','ح','خ'], 'چ':['ج','ح','خ'], 'ح':['ج','چ','خ'], 'خ':['ج','چ','ح'],
    'د':['ذ'], 'ذ':['د'],
    'ر':['ز','ژ'], 'ز':['ر','ژ'], 'ژ':['ر','ز'],
    'س':['ش'], 'ش':['س'],
    'ص':['ض'], 'ض':['ص'],
    'ط':['ظ'], 'ظ':['ط'],
    'ع':['غ'], 'غ':['ع'],
    'ف':['ق'], 'ق':['ف'],
    'ک':['گ'], 'گ':['ک'],
    'ل':['ا','ن'], 'ا':['ل'],
    'م':['ن'], 'ن':['م','ت','ب'],
    'ه':['ح','خ'], 'و':['ف','ر'], 'ی':['ب','ن']
  };
  const GENERIC_POOL = Object.keys(FAMILY);

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function blankDisplay(letter) {
    return CONNECTORS.has(letter) ? letter + 'ـ' : letter;
  }

  function buildSegments(data) {
    const chars = Array.from(data.w);
    const blankSet = new Set(data.b);
    const segments = [];
    let buf = "";
    chars.forEach((ch, i) => {
      if (blankSet.has(i)) {
        if (buf) { segments.push({ type: 'text', v: buf, endsBeforeBlank: true }); buf = ""; }
        segments.push({ type: 'blank', idx: i, letter: ch });
      } else {
        buf += ch;
      }
    });
    if (buf) segments.push({ type: 'text', v: buf, endsBeforeBlank: false });

    segments.forEach(seg => {
      if (seg.type === 'text' && seg.endsBeforeBlank) {
        const last = seg.v[seg.v.length - 1];
        if (CONNECTORS.has(last)) seg.v = seg.v + 'ـ';
      }
    });
    return segments;
  }

  function buildPool(data) {
    const chars = Array.from(data.w);
    const correctLetters = data.b.map(i => chars[i]);
    const usedGlobal = new Set(correctLetters);
    const poolItems = [];

    data.b.forEach(i => {
      const letter = chars[i];
      poolItems.push({ base: letter, display: blankDisplay(letter), isCorrect: true });

      let candidates = shuffleArr((FAMILY[letter] || []).filter(c => !usedGlobal.has(c)));
      const picks = [];
      for (const c of candidates) {
        if (picks.length >= 2) break;
        if (!picks.includes(c)) picks.push(c);
      }
      if (picks.length < 2) {
        const fallback = shuffleArr(GENERIC_POOL.filter(c => !usedGlobal.has(c) && !picks.includes(c) && c !== letter));
        for (const c of fallback) {
          if (picks.length >= 2) break;
          picks.push(c);
        }
      }
      picks.forEach(p => {
        usedGlobal.add(p);
        poolItems.push({ base: p, display: blankDisplay(p), isCorrect: false });
      });
    });

    return shuffleArr(poolItems);
  }

  let currentIdx = 0;
  let score = 0;
  let livesLeft = MAX_LIVES;
  let filledCount = 0;
  let totalBlanks = 0;
  let levelLocked = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playPopSound(isCorrect) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (isCorrect) {
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
    } else {
      osc.type = "square";
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    }

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function speakWord(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fa-IR';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
  }

  const emojiEl = document.getElementById("word-emoji");
  const wordContainer = document.getElementById("word-container");
  const poolEl = document.getElementById("letters-pool");
  const msgEl = document.getElementById("message");
  const scoreEl = document.getElementById("score-val");
  const lvlEl = document.getElementById("lvl-num");
  const lvlTotalEl = document.getElementById("lvl-total");
  const livesEl = document.getElementById("lives-row");
  const optionsTitleEl = document.getElementById("options-title");
  const gameOverEl = document.getElementById("game-over");
  const finalScoreEl = document.getElementById("final-score");
  const replayBtn = document.getElementById("replay-btn");

  lvlTotalEl.textContent = WORDS.length.toLocaleString('fa-IR');

  function goToNextLevelOrFinish(delay) {
    setTimeout(() => {
      if (currentIdx >= WORDS.length - 1) {
        showGameOver();
      } else {
        currentIdx++;
        loadLevel();
      }
    }, delay);
  }

  function showGameOver() { 
    try { gkSendScore(score); } catch(e){} 
    document.querySelector('.image-box').style.display = 'none';
    wordContainer.style.display = 'none';
    optionsTitleEl.style.display = 'none';
    poolEl.style.display = 'none';
    livesEl.style.display = 'none';
    msgEl.textContent = '';
    finalScoreEl.textContent = score.toLocaleString('fa-IR');
    gameOverEl.style.display = 'block';
  }

  replayBtn.addEventListener('click', () => {
    document.querySelector('.image-box').style.display = '';
    wordContainer.style.display = '';
    optionsTitleEl.style.display = '';
    poolEl.style.display = '';
    livesEl.style.display = '';
    gameOverEl.style.display = 'none';
    score = 0;
    scoreEl.textContent = score.toLocaleString('fa-IR');
    currentIdx = 0;
    loadLevel();
  });

  function renderLives() {
    livesEl.textContent = "❤️".repeat(livesLeft) + "🤍".repeat(MAX_LIVES - livesLeft);
  }

  function loadLevel() {
    const item = WORDS[currentIdx];
    levelLocked = false;
    livesLeft = MAX_LIVES;
    filledCount = 0;
    totalBlanks = item.b.length;
    renderLives();

    emojiEl.textContent = item.e;
    lvlEl.textContent = (currentIdx + 1).toLocaleString('fa-IR');
    msgEl.textContent = "";

    const segments = buildSegments(item);
    wordContainer.innerHTML = "";
    segments.forEach(seg => {
      if (seg.type === 'text') {
        const span = document.createElement('span');
        span.className = 'char-box';
        span.textContent = seg.v;
        wordContainer.appendChild(span);
      } else {
        const slot = document.createElement('div');
        slot.className = 'blank-slot';
        slot.dataset.idx = seg.idx;
        slot.dataset.letter = seg.letter;
        slot.dataset.filled = "false";
        slot.textContent = "؟";
        wordContainer.appendChild(slot);
      }
    });

    poolEl.innerHTML = "";
    const poolItems = buildPool(item);
    poolItems.forEach(entry => {
      const btn = document.createElement("div");
      btn.className = "letter-choice";
      btn.textContent = entry.display;
      btn.dataset.base = entry.base;
      attachLetterInteraction(btn, entry.base);
      poolEl.appendChild(btn);
    });
  }

  function getBlankSlots() {
    return Array.from(wordContainer.querySelectorAll(".blank-slot"));
  }

  function findOpenBlankByLetter(letter) {
    return getBlankSlots().find(s => s.dataset.filled === "false" && s.dataset.letter === letter);
  }

  function attachLetterInteraction(btn, base) {
    let startX = 0, startY = 0, moved = false, dragging = false;

    btn.addEventListener("pointerdown", (e) => {
      if (btn.classList.contains("disabled") || levelLocked) return;
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
      dragging = false;
      btn.setPointerCapture(e.pointerId);
    });

    btn.addEventListener("pointermove", (e) => {
      if (btn.classList.contains("disabled") || levelLocked) return;
      if (!btn.hasPointerCapture(e.pointerId)) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!dragging && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        dragging = true;
        moved = true;
        btn.classList.add("dragging");
      }
      if (dragging) {
        btn.style.left = `${e.clientX - 27}px`;
        btn.style.top = `${e.clientY - 27}px`;

        getBlankSlots().forEach(s => s.classList.remove("drag-over"));
        const target = blankUnderPoint(e.clientX, e.clientY);
        if (target && target.dataset.filled === "false") target.classList.add("drag-over");
      }
    });

    btn.addEventListener("pointerup", (e) => {
      if (btn.classList.contains("disabled") || levelLocked) return;
      btn.releasePointerCapture(e.pointerId);
      getBlankSlots().forEach(s => s.classList.remove("drag-over"));

      if (!moved) {
        handleLetterSelection(base, btn, null);
      } else {
        btn.classList.remove("dragging");
        btn.style.left = "";
        btn.style.top = "";
        const target = blankUnderPoint(e.clientX, e.clientY);
        if (target && target.dataset.filled === "false") {
          handleLetterSelection(base, btn, target);
        }
      }
    });

    btn.addEventListener("pointercancel", () => {
      btn.classList.remove("dragging");
      btn.style.left = "";
      btn.style.top = "";
      getBlankSlots().forEach(s => s.classList.remove("drag-over"));
    });
  }

  function blankUnderPoint(x, y) {
    return getBlankSlots().find(s => {
      const r = s.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    });
  }

  function handleLetterSelection(chosenBase, sourceBtn, specificTarget) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (levelLocked) return;

    const target = specificTarget || findOpenBlankByLetter(chosenBase);

    if (target && target.dataset.letter === chosenBase && target.dataset.filled === "false") {
      target.textContent = chosenBase;
      target.dataset.filled = "true";
      target.classList.add("filled-correct");
      sourceBtn.classList.add("used");
      playPopSound(true);

      score += 10;
      scoreEl.textContent = score.toLocaleString('fa-IR');
      filledCount++;

      if (filledCount >= totalBlanks) {
        levelLocked = true;
        const item = WORDS[currentIdx];
        speakWord(item.w);
        msgEl.style.color = "#16a34a";
        msgEl.textContent = `عالیه! کلمه «${item.w}» کامل شد 👏`;
        document.querySelectorAll(".letter-choice").forEach(b => b.classList.add("disabled"));
        goToNextLevelOrFinish(1600);
      }
    } else {
      playPopSound(false);
      livesLeft = Math.max(0, livesLeft - 1);
      renderLives();
      msgEl.style.color = "#dc2626";
      msgEl.textContent = "این حرف مناسب این جای خالی نبود، دوباره دقت کن!";
      if (sourceBtn) {
        sourceBtn.style.transform = "scale(0.9)";
        setTimeout(() => { sourceBtn.style.transform = ""; }, 150);
      }

      if (livesLeft <= 0 && filledCount < totalBlanks) {
        levelLocked = true;
        const item = WORDS[currentIdx];
        getBlankSlots().forEach(s => {
          if (s.dataset.filled === "false") {
            s.textContent = s.dataset.letter;
            s.dataset.filled = "true";
            s.classList.add("filled-reveal");
          }
        });
        document.querySelectorAll(".letter-choice").forEach(b => b.classList.add("disabled"));
        speakWord(item.w);
        msgEl.style.color = "#ea580c";
        msgEl.textContent = `فرصت‌ها تمام شد! کلمه درست: «${item.w}»`;
        goToNextLevelOrFinish(2000);
      }
    }
  }

  loadLevel();
</script>

</body>
</html>
