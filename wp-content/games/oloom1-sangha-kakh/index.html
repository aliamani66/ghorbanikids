<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دنیای شگفت‌انگیز سنگ‌ها - علوم اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(51,65,85,0.25); border: 4px solid #cbd5e1; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #f1f5f9; color: #334155; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .stone-box { background: #f8fafc; border: 3px solid #94a3b8; border-radius: 22px; padding: 20px; text-align: center; }
        .stone-icon { font-size: 4.5rem; }
        .stone-question { font-size: 1.3rem; font-weight: 900; color: #1e293b; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #cbd5e1; border-radius: 20px; padding: 14px; font-size: 1.2rem; font-weight: 900; color: #1e293b; cursor: pointer; transition: all 0.2s; text-align: center; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #475569, #1e293b); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🔬 علوم اول: سنگ‌ها و کاربرد آن‌ها</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <p style="text-align:center; color:#334155; font-weight:800; font-size:1.05rem;">ویژگی و کاربرد این سنگ چیست؟ 🪨</p>

        <div class="stone-box">
            <div class="stone-icon" id="stoneIcon">🪨</div>
            <div class="stone-question" id="stoneQuestion">سنگ‌های بستر رودخانه چگونه هستند؟</div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🪨💎🏔️</div>
            <h2 style="color:#1e293b; font-size:1.6rem; font-weight:900;">آفرین زمین‌شناس باهوش!</h2>
            <p style="color:#475569; font-weight:700;">سنگ‌ها و کاربردهای جالب آن‌ها را عالی یاد گرفتی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(180, 'sawtooth', 0.2); }
        function sndWin() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 120)); }

        const questions = [
            { icon: '🌊', text: 'سنگ‌های کف رودخانه به خاطر آب چگونه هستند؟', ans: '💎 صاف و لغزنده', pool: ['💎 صاف و لغزنده', '🌵 زبر و تیز', '🧻 نرم و پشمی', '🍫 خوراکی'] },
            { icon: '🏔️', text: 'سنگ‌های نوک کوه بیشتر به چه شکلی هستند؟', ans: '⛰️ زبر و زاویه‌دار', pool: ['⛰️ زبر و زاویه‌دار', '💎 کاملاً گرد و صیقلی', '🧽 اسفنجی', '🎈 سبک مثل پر'] },
            { icon: '🏠', text: 'از سنگ‌های محکم و مرمر در چه کاری استفاده می‌شود؟', ans: '🏢 نمای ساختمان و پله', pool: ['🏢 نمای ساختمان و پله', '👕 دوختن لباس', '🍲 پختن غذا', '🛏️ بالش خواب'] },
            { icon: '💍', text: 'سنگ‌های درخشان و قیمتی مثل الماس برای چه کاری هستند؟', ans: '👑 زیورآلات و طلا', pool: ['👑 زیورآلات و طلا', '🚗 چرخ ماشین', '🚪 در چوبی', '✏️ مداد پاک‌کن'] }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const q = questions[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            document.getElementById('stoneIcon').textContent = q.icon;
            document.getElementById('stoneQuestion').textContent = q.text;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.pool.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const q = questions[currentIdx];

            if(chosen === q.ans) {
                sndCorrect();
                btn.classList.add('correct');
                score += 25;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < questions.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
