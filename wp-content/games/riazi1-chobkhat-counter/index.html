<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چوب‌خط و انگشتان جادویی - ریاضی اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(37,99,235,0.25); border: 4px solid #bfdbfe; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #dbeafe; color: #1d4ed8; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); width: 10%; transition: width 0.3s; }
        .prompt-box { background: #f8fafc; border: 3px dashed #93c5fd; border-radius: 20px; padding: 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .prompt-title { color: #1e40af; font-size: 1.05rem; font-weight: 800; }
        .visual-target { font-size: 2.8rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 70px; align-items: center; }
        .tally-bundle { display: inline-flex; align-items: center; background: #f1f5f9; padding: 4px 8px; border-radius: 10px; border: 2px solid #cbd5e1; gap: 3px; }
        .tally-line { width: 6px; height: 36px; background: #2563eb; border-radius: 3px; }
        .tally-cross { width: 44px; height: 6px; background: #ef4444; border-radius: 3px; position: absolute; transform: rotate(-35deg); }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
        .option-btn { background: #ffffff; border: 3px solid #e2e8f0; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); min-height: 85px; }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.correct { background: #dcfce7; border-color: #22c55e; transform: scale(1.05); }
        .option-btn.wrong { background: #fee2e2; border-color: #ef4444; animation: shake 0.4s; }
        .option-text { font-size: 1.6rem; font-weight: 900; color: #1e293b; }
        .option-sub { font-size: 0.85rem; font-weight: 700; color: #64748b; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .modal-icon { font-size: 4.5rem; animation: bounce 0.8s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
        .btn-restart { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px -5px rgba(29,78,216,0.5); }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🧮 ریاضی اول: تم ۱ تا ۵</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
        
        <div class="prompt-box">
            <div class="prompt-title" id="questionTitle">چوب‌خط و تعداد مناسب را انتخاب کن!</div>
            <div class="visual-target" id="visualTarget">🍎🍎🍎</div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div class="modal-icon">🏆</div>
            <h2 style="color:#1e40af; font-size:1.6rem; font-weight:900;">آفرین قهرمان ریاضی!</h2>
            <p style="color:#475569; font-weight:700; font-size:1.05rem;">تمامی ۱۰ مرحله چوب‌خط را با موفقیت تمام کردی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523.25, 'triangle', 0.15); setTimeout(()=>playTone(659.25, 'triangle', 0.25), 120); }
        function sndWrong() { playTone(220, 'sawtooth', 0.2); }
        function sndWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3), i * 140)); }

        const questions = [
            { count: 3, icon: '🍎', type: 'count_to_tally', label: '۳ سیب' },
            { count: 5, icon: '⭐', type: 'count_to_tally', label: '۵ ستاره' },
            { count: 2, icon: '🌸', type: 'count_to_number', label: '۲ گل' },
            { count: 4, icon: '🎈', type: 'count_to_tally', label: '۴ بادکنک' },
            { count: 6, icon: '🚗', type: 'count_to_tally', label: '۶ ماشین' },
            { count: 1, icon: '🐱', type: 'count_to_number', label: '۱ گربه' },
            { count: 7, icon: '🍓', type: 'count_to_tally', label: '۷ توت‌فرنگی' },
            { count: 5, icon: '✋', type: 'finger_to_number', label: '۵ انگشت دست' },
            { count: 8, icon: '🦋', type: 'count_to_tally', label: '۸ پروانه' },
            { count: 10, icon: '🍬', type: 'count_to_tally', label: '۱۰ شکلات' }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) {
            return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function renderTallyHTML(num) {
            let res = '';
            let fullBundles = Math.floor(num / 5);
            let rem = num % 5;
            for(let b=0; b<fullBundles; b++) {
                res += `<div style="position:relative; display:inline-flex; align-items:center; gap:3px; background:#f1f5f9; padding:4px 6px; border-radius:8px; border:2px solid #cbd5e1;">
                    <div class="tally-line"></div><div class="tally-line"></div><div class="tally-line"></div><div class="tally-line"></div>
                    <div class="tally-cross" style="left:2px; top:18px;"></div>
                </div>`;
            }
            if(rem > 0) {
                res += `<div style="display:inline-flex; align-items:center; gap:3px; background:#f1f5f9; padding:4px 6px; border-radius:8px; border:2px solid #cbd5e1;">`;
                for(let r=0; r<rem; r++) { res += `<div class="tally-line"></div>`; }
                res += `</div>`;
            }
            return res;
        }

        function loadQuestion() {
            canClick = true;
            const q = questions[currentIdx];
            document.getElementById('progFill').style.width = ((currentIdx + 1) / questions.length * 100) + '%';
            document.getElementById('scoreVal').textContent = toPersian(score);
            
            let visual = '';
            for(let i=0; i<q.count; i++) { visual += q.icon + ' '; }
            document.getElementById('visualTarget').innerHTML = visual;

            // Generate 4 options
            let correctCount = q.count;
            let wrongCounts = new Set();
            while(wrongCounts.size < 3) {
                let r = Math.floor(Math.random() * 10) + 1;
                if (r !== correctCount) wrongCounts.add(r);
            }
            let allOptions = [correctCount, ...Array.from(wrongCounts)];
            allOptions.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            allOptions.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:6px;">${renderTallyHTML(opt)}</div>
                                 <span class="option-text">${toPersian(opt)}</span>`;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const q = questions[currentIdx];

            if(chosen === q.count) {
                sndCorrect();
                btn.classList.add('correct');
                score += 10;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < questions.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
