<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الگوی شیشه‌های رنگی کلیسا | Stained Glass Pattern</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 50% 15%, #1e1b4b, #090d16, #020408);
      --primary: #38bdf8;
      --gold: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --lead-frame: #1e293b;
      --lead-border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-viewport {
      width: min(94vw, 420px);
      height: min(94vh, 760px);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(56, 189, 248, 0.15);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      perspective: 1200px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 29, 0.8);
      padding: 10px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-title {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .hud-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .status-panel {
      text-align: center;
      margin: 6px 0;
    }

    .status-txt {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      min-height: 24px;
    }

    .timer-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      margin-top: 6px;
      overflow: hidden;
    }

    .timer-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ec4899, var(--primary));
      transform-origin: right;
      transition: transform 0.1s linear;
    }

    .window-container {
      position: relative;
      width: min(72vw, 270px);
      aspect-ratio: 1 / 1;
      margin: auto auto;
      background: #0b0f19;
      border-radius: 50%;
      padding: 12px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.9),
        inset 0 0 20px rgba(0,0,0,0.8),
        0 0 0 8px var(--lead-frame),
        0 0 0 10px var(--lead-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      transform-style: preserve-3d;
      transform: rotateX(10deg);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
    }

    .window-container::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    .glass-pane {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
      background-color: #1e293b;
    }

    .glass-pane:nth-child(1) { border-top-left-radius: 100%; }
    .glass-pane:nth-child(2) { border-top-right-radius: 100%; }
    .glass-pane:nth-child(3) { border-bottom-left-radius: 100%; }
    .glass-pane:nth-child(4) { border-bottom-right-radius: 100%; }

    .glass-pane::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .glass-pane:active:not(.disabled) {
      transform: scale(0.94);
    }

    .glass-pane.lit {
      filter: brightness(1.25) saturate(1.4);
      box-shadow: inset 0 0 25px rgba(255,255,255,0.6), 0 0 20px currentColor;
    }

    .glass-pane.current-focus {
      outline: 3px solid #ffffff;
      animation: pulseOutline 0.8s infinite alternate;
    }

    @keyframes pulseOutline {
      from { outline-color: rgba(255,255,255,0.4); }
      to { outline-color: rgba(255,255,255,1); }
    }

    .palette-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(10, 15, 29, 0.85);
      padding: 12px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .palette-label {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
    }

    .palette-colors {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
    }

    .color-swatch {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }

    .color-swatch:hover:not(.disabled) {
      transform: scale(1.15) translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
    }

    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 20px currentColor;
    }

    .color-swatch.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }

    .correct-fx {
      animation: winGlow 0.8s ease forwards;
    }

    .wrong-fx {
      animation: glassShake 0.4s ease;
    }

    @keyframes winGlow {
      0% { transform: rotateX(10deg) scale(1); filter: brightness(1); }
      50% { transform: rotateX(0deg) scale(1.06); filter: brightness(1.5); box-shadow: 0 0 50px rgba(56, 189, 248, 0.8); }
      100% { transform: rotateX(10deg) scale(1); filter: brightness(1); }
    }

    @keyframes glassShake {
      0%, 100% { transform: rotateX(10deg) translateX(0); }
      20%, 60% { transform: rotateX(10deg) translateX(-10px); }
      40%, 80% { transform: rotateX(10deg) translateX(10px); }
    }

    .screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 22, 0.95);
      backdrop-filter: blur(25px);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 100;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .screen-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .main-title {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 26px;
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: white;
      border: none;
      padding: 13px 44px;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: inherit;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body>

  <div class="game-viewport">
    <div class="hud">
      <div class="hud-box">
        <span class="hud-title">مرحله</span>
        <span class="hud-val" id="level-val">۱</span>
      </div>
      <div class="hud-box">
        <span class="hud-title">امتیاز</span>
        <span class="hud-val" id="score-val">۰</span>
      </div>
      <div class="hud-box">
        <span class="hud-title">فرصت</span>
        <span class="hud-val" id="lives-val">❤️❤️❤️</span>
      </div>
    </div>

    <div class="status-panel">
      <div class="status-txt" id="status-txt">طرح رنگی پنجره را به خاطر بسپارید...</div>
      <div class="timer-track">
        <div class="timer-fill" id="timer-fill"></div>
      </div>
    </div>

    <div class="window-container" id="stained-window">
      <div class="glass-pane" data-index="0"></div>
      <div class="glass-pane" data-index="1"></div>
      <div class="glass-pane" data-index="2"></div>
      <div class="glass-pane" data-index="3"></div>
    </div>

    <div class="palette-container">
      <div class="palette-label" id="palette-label">رنگ مورد نظر را انتخاب و روی شیشه بزنید:</div>
      <div class="palette-colors" id="palette-colors"></div>
    </div>

    <div class="screen-overlay" id="start-screen">
      <h1 class="main-title">شیشه‌های رنگی کلیسا</h1>
      <p class="subtitle">
        رنگ هر ۴ تکه شیشه‌ پنجره را پیش از خاموش شدن نور به خاطر بسپارید.<br>
        سپس با انتخاب رنگ از پالت پایین، شیشه‌ها را دوباره مثل طرح اصلی رنگ‌آمیزی کنید!
      </p>
      <button class="btn-action" id="start-btn">شروع بازی</button>
    </div>
  </div>

  <script>
    // GhorbaniKids Score Submission Protocol
    function gkSendScore(finalScore) {
        try {
            var sc = parseInt(finalScore) || 0;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'GK_SUBMIT_SCORE',
                    score: sc
                }, '*');
            }
        } catch(e) { console.error('GK postMessage error:', e); }
    }
    
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playChime(freq = 600) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      },
      playColorPick() {
        if (!this.ctx) return;
        this.playChime(880);
      },
      playGlassPaint() {
        if (!this.ctx) return;
        this.playChime(587.33);
      },
      playSuccess() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => this.playChime(f), i * 70);
        });
      },
      playFail() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    };

    const PALETTE = [
      { id: 'ruby', name: 'یاقوتی', hex: '#ef4444' },
      { id: 'sapphire', name: 'لاجوردی', hex: '#2563eb' },
      { id: 'emerald', name: 'زمردی', hex: '#10b981' },
      { id: 'amber', name: 'کهربایی', hex: '#f59e0b' },
      { id: 'amethyst', name: 'ارغوانی', hex: '#a855f7' }
    ];

    const STATE = {
      level: 1,
      score: 0,
      lives: 3,
      phase: 'IDLE',
      targetColors: [],
      userColors: [null, null, null, null],
      selectedColor: null
    };

    const stainedWindow = document.getElementById('stained-window');
    const glassPanes = document.querySelectorAll('.glass-pane');
    const paletteContainer = document.getElementById('palette-colors');
    const levelVal = document.getElementById('level-val');
    const scoreVal = document.getElementById('score-val');
    const livesVal = document.getElementById('lives-val');
    const statusTxt = document.getElementById('status-txt');
    const timerFill = document.getElementById('timer-fill');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');

    function buildPalette() {
      paletteContainer.innerHTML = '';
      PALETTE.forEach(c => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch disabled';
        swatch.style.backgroundColor = c.hex;
        swatch.dataset.hex = c.hex;
        swatch.title = c.name;
        swatch.addEventListener('click', () => selectColor(c.hex, swatch));
        paletteContainer.appendChild(swatch);
      });
    }

    function selectColor(hex, element) {
      if (STATE.phase !== 'PAINT') return;
      STATE.selectedColor = hex;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      element.classList.add('selected');
      Sound.playColorPick();
    }

    function startRound() {
      STATE.phase = 'MEMORIZE';
      STATE.userColors = [null, null, null, null];
      STATE.selectedColor = null;
      document.querySelectorAll('.color-swatch').forEach(s => {
        s.classList.remove('selected');
        s.classList.add('disabled');
      });

      const availableColors = STATE.level === 1 ? PALETTE.slice(0, 3) : PALETTE;
      STATE.targetColors = Array.from({ length: 4 }, () => {
        const r = availableColors[Math.floor(Math.random() * availableColors.length)];
        return r.hex;
      });

      glassPanes.forEach((pane, idx) => {
        pane.style.backgroundColor = STATE.targetColors[idx];
        pane.classList.add('lit');
      });

      Sound.playChime(700);
      statusTxt.textContent = 'رنگ شیشه‌ها را به خاطر بسپارید...';
      statusTxt.style.color = '#38bdf8';

      const memorizeTime = Math.max(1200, 3600 - (STATE.level - 1) * 300);

      timerFill.style.transition = 'none';
      timerFill.style.transform = 'scaleX(1)';
      setTimeout(() => {
        timerFill.style.transition = `transform ${memorizeTime}ms linear`;
        timerFill.style.transform = 'scaleX(0)';
      }, 40);

      setTimeout(() => {
        glassPanes.forEach(pane => {
          pane.style.backgroundColor = '#1e293b';
          pane.classList.remove('lit');
        });

        STATE.phase = 'PAINT';
        statusTxt.textContent = 'یک رنگ بردارید و هر ۴ قطعه را رنگ کنید:';
        statusTxt.style.color = '#f59e0b';
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('disabled'));

        selectColor(PALETTE[0].hex, document.querySelectorAll('.color-swatch')[0]);
      }, memorizeTime);
    }

    glassPanes.forEach(pane => {
      pane.addEventListener('click', () => {
        if (STATE.phase !== 'PAINT' || !STATE.selectedColor) return;

        const idx = parseInt(pane.dataset.index);
        STATE.userColors[idx] = STATE.selectedColor;
        pane.style.backgroundColor = STATE.selectedColor;
        pane.classList.add('lit');
        Sound.playGlassPaint();

        if (STATE.userColors.every(c => c !== null)) {
          evaluateSubmission();
        }
      });
    });

    function evaluateSubmission() {
      STATE.phase = 'RESULT';
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.add('disabled'));

      const isCorrect = STATE.userColors.every((col, idx) => col === STATE.targetColors[idx]);

      if (isCorrect) {
        Sound.playSuccess();
        stainedWindow.classList.add('correct-fx');
        STATE.score += 150 * STATE.level;
        STATE.level += 1;
        statusTxt.textContent = 'طرح کلیسا با شکوه بازسازی شد ✨';
        statusTxt.style.color = '#10b981';
      } else {
        Sound.playFail();
        stainedWindow.classList.add('wrong-fx');
        STATE.lives -= 1;

        setTimeout(() => {
          glassPanes.forEach((pane, idx) => {
            pane.style.backgroundColor = STATE.targetColors[idx];
          });
        }, 300);

        statusTxt.textContent = 'طرح مطابقت نداشت! طرح اصلی آشکار شد.';
        statusTxt.style.color = '#ef4444';
      }

      updateHUD();

      setTimeout(() => {
        stainedWindow.classList.remove('correct-fx', 'wrong-fx');
        if (STATE.lives > 0) {
          startRound();
        } else {
          gameOver();
        }
      }, 1800);
    }

    function updateHUD() {
      levelVal.textContent = STATE.level;
      scoreVal.textContent = STATE.score;
      livesVal.textContent = '❤️❤️❤️'.slice(0, Math.max(0, STATE.lives * 2));
    }

    function gameOver() { 
      try { gkSendScore(STATE.score); } catch(e){} 
      startScreen.querySelector('.main-title').textContent = 'پایان بازی!';
      startScreen.querySelector('.subtitle').innerHTML = `
        امتیاز نهایی کسب شده: <b>${STATE.score}</b><br>
        بیشترین مرحله طی شده: <b>${STATE.level}</b>
      `;
      startBtn.textContent = 'تلاش مجدد';
      startScreen.classList.remove('hidden');
    }

    startBtn.addEventListener('click', () => {
      Sound.init();
      STATE.level = 1;
      STATE.score = 0;
      STATE.lives = 3;
      updateHUD();
      startScreen.classList.add('hidden');
      startRound();
    });

    buildPalette();
  </script>
</body>
</html>
