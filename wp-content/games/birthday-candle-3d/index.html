<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کیک تولد و شمع‌ها | Birthday Candle Pattern 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 10px 22px;
            color: #f8fafc;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        #instruction {
            position: absolute;
            bottom: 125px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 32px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.98) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 36px 44px;
            text-align: center;
            color: #fff;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }
        .card h1 {
            font-size: 2.2rem;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #f43f5e, #fbbf24, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .btn {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: #fff;
            border: none;
            outline: none;
            padding: 14px 44px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 14px 30px rgba(244, 63, 94, 0.6);
        }
        .btn:active {
            transform: scale(0.97);
        }
        #candle-selector {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 10;
        }
        .candle-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .candle-btn:active {
            transform: scale(0.92);
        }
        .candle-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #ffffffcc;
        }
        .hidden {
            display: none !important;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    // GhorbaniKids Score Submission Protocol
    function gkSendScore(finalScore) {
        try {
            var sc = parseInt(finalScore) || 0;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'GK_SUBMIT_SCORE',
                    score: sc
                }, '*');
            }
        } catch(e) { console.error('GK postMessage error:', e); }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div id="hud">
        <div class="glass-panel">مرحله: <span id="level-display">۱</span></div>
        <div class="glass-panel">امتیاز: <span id="score-display">۰</span></div>
    </div>

    <div id="instruction">آماده برای به خاطر سپردن شمع‌ها...</div>

    <div id="start-screen" class="overlay-screen">
        <div class="card">
            <h1>کیک تولد و شمع‌ها</h1>
            <p>شمع‌های رنگی روی کیک به نوبت روشن می‌شوند. ترتیب روشن شدن رنگ‌ها را به خاطر بسپارید و سپس به همان ترتیب شمع‌ها را روشن کنید!</p>
            <button class="btn" id="start-btn">شروع بازی</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay-screen hidden">
        <div class="card">
            <h1>پایان جشن تولد!</h1>
            <p>امتیاز نهایی شما: <span id="final-score" style="font-weight:bold; color:#fbbf24;">0</span></p>
            <button class="btn" id="restart-btn">بازی مجدد</button>
        </div>
    </div>

    <div id="candle-selector" class="hidden">
        <button class="candle-btn" id="btn-blue" style="border-color: #38bdf8;">
            <span class="candle-dot" style="background:#38bdf8; box-shadow:0 0 10px #38bdf8;"></span> آبی
        </button>
        <button class="candle-btn" id="btn-red" style="border-color: #f43f5e;">
            <span class="candle-dot" style="background:#f43f5e; box-shadow:0 0 10px #f43f5e;"></span> قرمز
        </button>
        <button class="candle-btn" id="btn-yellow" style="border-color: #fbbf24;">
            <span class="candle-dot" style="background:#fbbf24; box-shadow:0 0 10px #fbbf24;"></span> زرد
        </button>
    </div>

    <div id="canvas-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCandleTone(index) {
                if (!this.ctx) return;
                const freqs = [349.23, 440.00, 523.25]; // F4 (آبی), A4 (قرمز), C5 (زرد)
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freqs[index], this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
            playWin() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
                });
            }
            playFail() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sound = new SoundFX();

        let scene, camera, renderer;
        let cakeGroup;
        let candles = [];
        let flames = [];
        let candleLights = [];
        let particles;
        let raycaster, mouse;

        let sequence = [];
        let playerStep = 0;
        let isPlayerTurn = false;
        let level = 1;
        let score = 0;

        const CANDLE_CONFIGS = [
            { id: 0, name: 'آبی',  color: 0x38bdf8, flameColor: 0x00d2ff, x: -1.4, z: 0.2 },
            { id: 1, name: 'قرمز', color: 0xf43f5e, flameColor: 0xff3366, x: 0.0,  z: -0.8 },
            { id: 2, name: 'زرد',  color: 0xfbbf24, flameColor: 0xffaa00, x: 1.4,  z: 0.2 }
        ];

        function initScene() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5.5, 9.5);
            camera.lookAt(0, 0.3, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.7);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(6, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            buildCakeAndCandles();
            createFestiveParticles();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointerdown', onCanvasClick);
        }

        function buildCakeAndCandles() {
            cakeGroup = new THREE.Group();

            const plateMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.1, metalness: 0.2 });
            const plate = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.2, 0.2, 40), plateMat);
            plate.position.y = -1.1;
            plate.receiveShadow = true;
            cakeGroup.add(plate);

            const baseCakeMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 });
            const cakeBase = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 3.0, 1.3, 36), baseCakeMat);
            cakeBase.position.y = -0.35;
            cakeBase.castShadow = true;
            cakeBase.receiveShadow = true;
            cakeGroup.add(cakeBase);

            const icingMat = new THREE.MeshStandardMaterial({ color: 0xfdf2f8, roughness: 0.3, metalness: 0.1 });
            const icing = new THREE.Mesh(new THREE.CylinderGeometry(2.95, 2.95, 0.45, 36), icingMat);
            icing.position.y = 0.35;
            icing.castShadow = true;
            cakeGroup.add(icing);

            for (let i = 0; i < 16; i++) {
                const creamMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.3 });
                const cream = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), creamMat);
                const angle = (i / 16) * Math.PI * 2;
                cream.position.set(Math.cos(angle) * 2.7, 0.55, Math.sin(angle) * 2.7);
                cakeGroup.add(cream);
            }

            CANDLE_CONFIGS.forEach((cfg) => {
                const candleGroup = new THREE.Group();

                const candleMat = new THREE.MeshStandardMaterial({
                    color: cfg.color,
                    roughness: 0.3,
                    metalness: 0.2
                });
                const candleMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.3, 24), candleMat);
                candleMesh.position.y = 1.2;
                candleMesh.castShadow = true;
                candleMesh.userData = { id: cfg.id };
                candleGroup.add(candleMesh);

                const wickMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
                const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.25, 8), wickMat);
                wick.position.y = 1.95;
                candleGroup.add(wick);

                const flameGeo = new THREE.ConeGeometry(0.14, 0.45, 16);
                const flameMat = new THREE.MeshStandardMaterial({
                    color: cfg.flameColor,
                    emissive: cfg.flameColor,
                    emissiveIntensity: 0.1,
                    transparent: true,
                    opacity: 0.2
                });
                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.position.y = 2.25;
                flame.scale.set(0.1, 0.1, 0.1);
                candleGroup.add(flame);
                flames.push(flame);

                const cLight = new THREE.PointLight(cfg.flameColor, 0, 4);
                cLight.position.set(0, 2.4, 0);
                candleGroup.add(cLight);
                candleLights.push(cLight);

                candleGroup.position.set(cfg.x, 0, cfg.z);
                cakeGroup.add(candleGroup);
                candles.push(candleMesh);
            });

            scene.add(cakeGroup);
        }

        function createFestiveParticles() {
            const count = 150;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 16;
                positions[i + 1] = Math.random() * 8 - 1;
                positions[i + 2] = (Math.random() - 0.5) * 10;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ size: 0.05, color: 0xf43f5e, transparent: true, opacity: 0.6 });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);
        }

        function igniteCandle(index, duration = 450) {
            return new Promise(resolve => {
                const flame = flames[index];
                const cLight = candleLights[index];
                
                sound.playCandleTone(index);

                new TWEEN.Tween(flame.scale)
                    .to({ x: 1.3, y: 1.4, z: 1.3 }, duration * 0.45)
                    .easing(TWEEN.Easing.Back.Out)
                    .yoyo(true)
                    .repeat(1)
                    .start();

                new TWEEN.Tween(flame.material)
                    .to({ emissiveIntensity: 2.5, opacity: 0.95 }, duration * 0.45)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .yoyo(true)
                    .repeat(1)
                    .start();

                new TWEEN.Tween(cLight)
                    .to({ intensity: 2.2 }, duration * 0.45)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .yoyo(true)
                    .repeat(1)
                    .onComplete(() => {
                        flame.material.emissiveIntensity = 0.1;
                        flame.material.opacity = 0.2;
                        flame.scale.set(0.1, 0.1, 0.1);
                        cLight.intensity = 0;
                        resolve();
                    })
                    .start();
            });
        }

        async function playSequence() {
            isPlayerTurn = false;
            document.getElementById('candle-selector').classList.add('hidden');
            document.getElementById('instruction').innerText = "به ترتیب روشن شدن شمع‌ها نگاه کنید...";

            let speed, pause;
            if (level <= 4) {
                // مراحل ۱ تا ۴: آسان و کند
                speed = 620;
                pause = 340;
            } else {
                // از مرحله ۵ به بعد: سریع‌تر و سخت‌تر
                const hardStep = level - 4;
                speed = Math.max(180, 500 - (hardStep * 45));
                pause = Math.max(90, 260 - (hardStep * 25));
            }

            await new Promise(r => setTimeout(r, 600));

            for (let i = 0; i < sequence.length; i++) {
                await igniteCandle(sequence[i], speed);
                await new Promise(r => setTimeout(r, pause));
            }

            playerStep = 0;
            isPlayerTurn = true;
            document.getElementById('instruction').innerText = "حالا شمع‌ها را به همان ترتیب روشن کنید:";
            document.getElementById('candle-selector').classList.remove('hidden');
        }

        function startNewRound() {
            let targetLength;
            if (level <= 4) {
                // مراحل ۱ تا ۴: رشد کند طول توالی
                targetLength = 2 + level;
            } else {
                // از مرحله ۵ به بعد: رشد سریع‌تر طول توالی
                targetLength = 6 + (level - 4) * 2;
            }
            sequence = [];
            for (let i = 0; i < targetLength; i++) {
                sequence.push(Math.floor(Math.random() * 3));
            }
            playSequence();
        }

        function handleInput(colorIndex) {
            if (!isPlayerTurn) return;

            igniteCandle(colorIndex, 280);

            if (colorIndex === sequence[playerStep]) {
                playerStep++;

                if (playerStep >= sequence.length) {
                    isPlayerTurn = false;
                    document.getElementById('candle-selector').classList.add('hidden');
                    sound.playWin();
                    score += 120 + (level * 35);
                    level++;
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('level-display').innerText = level;
                    document.getElementById('instruction').innerText = "توالی کاملاً درست بود! 🎂🎉";

                    new TWEEN.Tween(cakeGroup.rotation)
                        .to({ y: cakeGroup.rotation.y + Math.PI * 2 }, 900)
                        .easing(TWEEN.Easing.Back.Out)
                        .onComplete(() => {
                            setTimeout(startNewRound, 600);
                        })
                        .start();
                }
            } else {
                isPlayerTurn = false;
                sound.playFail();
                document.getElementById('candle-selector').classList.add('hidden');
                document.getElementById('instruction').innerText = "ترتیب اشتباه شد! ❌";

                new TWEEN.Tween(cakeGroup.position)
                    .to({ x: 0.3 }, 50)
                    .repeat(7)
                    .yoyo(true)
                    .onComplete(() => {
                        cakeGroup.position.x = 0;
                        try { gkSendScore(score); } catch(e){}
                        document.getElementById('final-score').innerText = score;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    })
                    .start();
            }
        }

        function onCanvasClick(event) {
            if (!isPlayerTurn) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(candles);

            if (intersects.length > 0) {
                const clickedCandle = intersects[0].object;
                handleInput(clickedCandle.userData.id);
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            const time = clock.getElapsedTime();

            if (particles) {
                particles.rotation.y = time * 0.04;
            }

            if (cakeGroup) {
                cakeGroup.position.y = Math.sin(time * 1.5) * 0.06;
                if (isPlayerTurn) {
                    cakeGroup.rotation.y = Math.sin(time * 0.8) * 0.15;
                }
            }

            flames.forEach((flame, i) => {
                if (flame.scale.x > 0.3) {
                    flame.position.x = Math.sin(time * 15 + i) * 0.02;
                }
            });

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        document.getElementById('btn-blue').addEventListener('click', () => handleInput(0));
        document.getElementById('btn-red').addEventListener('click', () => handleInput(1));
        document.getElementById('btn-yellow').addEventListener('click', () => handleInput(2));

        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            document.getElementById('start-screen').classList.add('hidden');
            score = 0;
            level = 1;
            document.getElementById('score-display').innerText = score;
            document.getElementById('level-display').innerText = level;
            startNewRound();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0;
            level = 1;
            document.getElementById('score-display').innerText = score;
            document.getElementById('level-display').innerText = level;
            startNewRound();
        });

        window.onload = () => {
            initScene();
            animate();
        };
    </script>
</body>
</html>
