<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کارآگاه حواس پنج‌گانه - علوم اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(5,150,105,0.25); border: 4px solid #a7f3d0; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #d1fae5; color: #047857; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .target-box { background: #f0fdf4; border: 3px solid #86efac; border-radius: 22px; padding: 20px; text-align: center; }
        .target-icon { font-size: 4rem; }
        .target-name { font-size: 1.8rem; font-weight: 900; color: #065f46; margin-top: 4px; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #bbf7d0; border-radius: 20px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.25rem; font-weight: 900; color: #065f46; cursor: pointer; transition: all 0.2s; min-height: 70px; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🔬 علوم اول: حواس پنج‌گانه</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <p style="text-align:center; color:#047857; font-weight:800; font-size:1.05rem;">این پدیده با کدام حس درک می‌شود؟</p>

        <div class="target-box">
            <div class="target-icon" id="targetIcon">🌈</div>
            <div class="target-name" id="targetName">رنگین‌کمان زیبا</div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">👁️👂🔬</div>
            <h2 style="color:#065f46; font-size:1.6rem; font-weight:900;">آفرین دانشمند کوچک!</h2>
            <p style="color:#475569; font-weight:700;">تمام حواس پنج‌گانه را به درستی تشخیص دادی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(180, 'sawtooth', 0.2); }
        function sndWin() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 120)); }

        const questions = [
            { icon: '🌈', name: 'رنگین‌کمان زیبا', ans: '👁️ بینایی (چشم)', pool: ['👁️ بینایی (چشم)', '👂 شنوایی (گوش)', '👃 بویایی (بینی)', '👅 چشایی (زبان)'] },
            { icon: '🔔', name: 'صدای زنگ مدرسه', ans: '👂 شنوایی (گوش)', pool: ['👂 شنوایی (گوش)', '👁️ بینایی (چشم)', '🖐️ لامسه (پوست)', '👅 چشایی (زبان)'] },
            { icon: '🌹', name: 'عطر گل محمدی', ans: '👃 بویایی (بینی)', pool: ['👃 بویایی (بینی)', '👅 چشایی (زبان)', '👁️ بینایی (چشم)', '👂 شنوایی (گوش)'] },
            { icon: '🍋', name: 'مزه ترش لیمو', ans: '👅 چشایی (زبان)', pool: ['👅 چشایی (زبان)', '👃 بویایی (بینی)', '🖐️ لامسه (پوست)', '👁️ بینایی (چشم)'] },
            { icon: '🧊', name: 'سردی قالب یخ', ans: '🖐️ لامسه (پوست)', pool: ['🖐️ لامسه (پوست)', '👂 شنوایی (گوش)', '👃 بویایی (بینی)', '👁️ بینایی (چشم)'] },
            { icon: '🐦', name: 'آواز بلبل', ans: '👂 شنوایی (گوش)', pool: ['👂 شنوایی (گوش)', '👁️ بینایی (چشم)', '👅 چشایی (زبان)', '🖐️ لامسه (پوست)'] }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const q = questions[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            document.getElementById('targetIcon').textContent = q.icon;
            document.getElementById('targetName').textContent = q.name;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.pool.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const q = questions[currentIdx];

            if(chosen === q.ans) {
                sndCorrect();
                btn.classList.add('correct');
                score += 16;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < questions.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
