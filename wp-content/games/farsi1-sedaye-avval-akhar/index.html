<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قطار صداهای اول و آخر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IRANSansXFaNum', 'IRANSansX', Tahoma, sans-serif; user-select: none; }
        body { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .game-card { background: #ffffff; border-radius: 24px; box-shadow: 0 15px 35px rgba(245,158,11,0.15); width: 100%; max-width: 480px; padding: 20px; text-align: center; border: 3px solid #fde68a; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .badge { background: #fef3c7; color: #b45309; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; }
        .score-box { background: #b45309; color: #fff; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; }
        .question-box { background: #fffbeb; border: 3px dashed #fcd34d; border-radius: 20px; padding: 20px; margin: 16px 0; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .word-icon { font-size: 4rem; margin-bottom: 8px; }
        .word-text { font-size: 1.6rem; font-weight: 900; color: #78350f; }
        .question-text { font-size: 1.1rem; font-weight: 800; color: #92400e; margin-top: 6px; }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
        .opt-btn { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 14px; font-size: 1.4rem; font-weight: 900; color: #1e293b; cursor: pointer; transition: all 0.15s; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #22c55e !important; color: #fff !important; border-color: #16a34a !important; }
        .opt-btn.wrong { background: #ef4444 !important; color: #fff !important; border-color: #dc2626 !important; }
        .modal { display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; z-index: 10; }
        .btn-restart { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">📖 فارسی اول: صدای اول و آخر</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <div class="question-box">
            <div class="word-icon" id="wordIcon">🍎</div>
            <div class="word-text" id="wordText">سیب</div>
            <div class="question-text" id="questionPrompt">صدای «اول» این کلمه چیه؟</div>
        </div>

        <div class="options-grid" id="optionsContainer">
            <!-- Shuffled options -->
        </div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🚂✨</div>
            <h2 style="color:#b45309; font-size:1.6rem; font-weight:900;">آفرین قطار کلمات کامل شد!</h2>
            <p style="color:#475569; font-weight:700;">تمام صداهای اول و آخر را با دقت تشخیص دادی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(220, 'triangle', 0.25); }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        const pool = [
            { icon: '🍎', word: 'سیب', mode: 'first', answer: 'س', wrongs: ['ب', 'م', 'د'] },
            { icon: '🦆', word: 'اردک', mode: 'last', answer: 'ک', wrongs: ['ا', 'د', 'ر'] },
            { icon: '🍞', word: 'نان', mode: 'first', answer: 'ن', wrongs: ['ب', 'ت', 'م'] },
            { icon: '🌸', word: 'گل', mode: 'last', answer: 'ل', wrongs: ['گ', 'ن', 'د'] },
            { icon: '🚗', word: 'ماشین', mode: 'first', answer: 'م', wrongs: ['ش', 'ن', 'س'] },
            { icon: '🌳', word: 'درخت', mode: 'last', answer: 'ت', wrongs: ['د', 'ر', 'خ'] },
            { icon: '🐟', word: 'ماهی', mode: 'last', answer: 'ی', wrongs: ['م', 'ه', 'ش'] },
            { icon: '☀️', word: 'خورشید', mode: 'first', answer: 'خ', wrongs: ['ش', 'د', 'ر'] },
            { icon: '🌧️', word: 'باران', mode: 'first', answer: 'ب', wrongs: ['ر', 'ن', 'د'] },
            { icon: ' کتاب 📚', word: 'کتاب', mode: 'last', answer: 'ب', wrongs: ['ک', 'ت', 'م'] }
        ];

        let gameQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const q = gameQuestions[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            document.getElementById('wordIcon').textContent = q.icon;
            document.getElementById('wordText').textContent = q.word;
            document.getElementById('questionPrompt').textContent = q.mode === 'first' ? 'صدای «اول» این کلمه چیه؟' : 'صدای «آخر» این کلمه چیه؟';

            // Pick 2 random wrongs + 1 answer and shuffle
            const chosenWrongs = shuffleArray(q.wrongs).slice(0, 2);
            const options = shuffleArray([q.answer, ...chosenWrongs]);

            const cont = document.getElementById('optionsContainer');
            cont.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, q.answer, btn);
                cont.appendChild(btn);
            });
        }

        function checkAnswer(chosen, correct, btn) {
            if(!canClick) return;
            canClick = false;

            if(chosen === correct) {
                sndCorrect();
                btn.classList.add('correct');
                score += 12;
            } else {
                sndWrong();
                btn.classList.add('wrong');
            }

            setTimeout(() => {
                currentIdx++;
                if(currentIdx < gameQuestions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 600);
        }

        function endGame() {
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').style.display = 'flex';
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            score = 0;
            currentIdx = 0;
            gameQuestions = shuffleArray(pool).slice(0, 8);
            document.getElementById('endModal').style.display = 'none';
            loadQuestion();
        }

        restartGame();
    </script>
</body>
</html>
