<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پل کلمات و جمله‌سازی - فارسی اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(22,163,74,0.25); border: 4px solid #bbf7d0; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #dcfce7; color: #15803d; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .sentence-drop-box { min-height: 80px; background: #f8fafc; border: 3px dashed #86efac; border-radius: 20px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .word-chip { background: #16a34a; color: #fff; font-weight: 900; font-size: 1.25rem; padding: 10px 18px; border-radius: 16px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .word-chip:active { transform: scale(0.92); }
        .pool-box { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; }
        .pool-chip { background: #ffffff; border: 3px solid #86efac; color: #166534; font-weight: 900; font-size: 1.25rem; padding: 10px 18px; border-radius: 16px; cursor: pointer; }
        .btn-check { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border: none; padding: 14px; border-radius: 18px; font-size: 1.15rem; font-weight: 900; cursor: pointer; width: 100%; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">📖 فارسی اول: مرتب کردن و جمله‌سازی</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <p style="text-align:center; color:#15803d; font-weight:800; font-size:1.05rem;">کلمات را به ترتیب لمس کن تا جمله ساخته شود:</p>

        <div class="sentence-drop-box" id="dropBox"></div>
        <div class="pool-box" id="poolBox"></div>

        <button class="btn-check" onclick="checkSentence()">✔️ بررسی جمله</button>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">📜✨</div>
            <h2 style="color:#15803d; font-size:1.6rem; font-weight:900;">آفرین نویسنده کوچک!</h2>
            <p style="color:#475569; font-weight:700;">تمام جملات کتاب فارسی اول را مرتب ساختی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(180, 'sawtooth', 0.2); }
        function sndWin() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 120)); }

        const sentences = [
            { words: ['بابا', 'آب', 'داد'], correct: 'بابا آب داد' },
            { words: ['مادر', 'نان', 'داد'], correct: 'مادر نان داد' },
            { words: ['من', 'ایران', 'را', 'دوست', 'دارم'], correct: 'من ایران را دوست دارم' },
            { words: ['باران', 'نم', 'نم', 'می‌بارد'], correct: 'باران نم نم می‌بارد' },
            { words: ['امین', 'سیب', 'خورد'], correct: 'امین سیب خورد' },
            { words: ['آزاده', 'به', 'مدرسه', 'رفت'], correct: 'آزاده به مدرسه رفت' }
        ];

        let currentIdx = 0;
        let score = 0;
        let currentBuild = [];

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            currentBuild = [];
            const s = sentences[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            renderBoxes();
        }

        function renderBoxes() {
            const s = sentences[currentIdx];
            const drop = document.getElementById('dropBox');
            drop.innerHTML = '';
            currentBuild.forEach((w, idx) => {
                const chip = document.createElement('div');
                chip.className = 'word-chip';
                chip.textContent = w;
                chip.onclick = () => {
                    currentBuild.splice(idx, 1);
                    renderBoxes();
                };
                drop.appendChild(chip);
            });

            const pool = document.getElementById('poolBox');
            pool.innerHTML = '';
            let availableWords = [...s.words];
            currentBuild.forEach(w => {
                let found = availableWords.indexOf(w);
                if(found !== -1) availableWords.splice(found, 1);
            });

            availableWords.forEach(w => {
                const chip = document.createElement('div');
                chip.className = 'pool-chip';
                chip.textContent = w;
                chip.onclick = () => {
                    currentBuild.push(w);
                    renderBoxes();
                };
                pool.appendChild(chip);
            });
        }

        function checkSentence() {
            const s = sentences[currentIdx];
            const built = currentBuild.join(' ');
            if(built === s.correct) {
                sndCorrect();
                score += 15;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < sentences.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
