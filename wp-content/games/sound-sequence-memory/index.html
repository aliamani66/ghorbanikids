<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ردپای صدا | Sound Sequence Memory</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; user-select: none; }
    body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    #game-container {
      width: 90vw; max-width: 450px; height: 85vh; max-height: 700px;
      background: var(--card); border-radius: 30px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden;
    }

    .header { width: 100%; padding: 20px; display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; }

    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
      padding: 30px; width: 100%; height: 100%; align-items: center;
    }

    .btn {
      aspect-ratio: 1; border-radius: 20px; cursor: pointer;
      display: flex; justify-content: center; align-items: center; font-size: 3rem;
      transition: all 0.1s; border: none;
      box-shadow: 0 10px 0 #334155; /* ایجاد افکت سه بعدی */
    }
    .btn:active { transform: translateY(10px); box-shadow: 0 0 0 #334155; }
    .btn.active { transform: translateY(10px); box-shadow: 0 0 0 #334155; filter: brightness(1.5); }

    .overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
    }

    .main-btn {
      background: var(--accent); color: white; padding: 15px 40px; border-radius: 50px;
      border: none; font-size: 1.5rem; font-weight: bold; cursor: pointer;
    }

    #msg { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
    .hidden { display: none; }

    #level-toast {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white; font-weight: bold; text-align: center;
      padding: 25px 35px; border-radius: 24px; z-index: 20;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #level-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #level-toast .big { font-size: 2.4rem; display: block; margin-bottom: 6px; }
    #level-toast .small { font-size: 1.1rem; opacity: 0.9; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <div>مرحله: <span id="level">1</span></div>
    <div>امتیاز: <span id="score">0</span></div>
  </div>

  <div id="start-screen" class="overlay">
    <h1 style="margin-bottom:20px">🎮 ردپای صدا</h1>
    <button class="main-btn" onclick="startGame()">شروع بازی</button>
  </div>

  <div id="level-toast">
    <span class="big">🎉 آفرین!</span>
    <span class="small" id="level-toast-text">مرحله ۱ تموم شد</span>
  </div>

  <div class="grid">
    <button class="btn" id="btn-0" style="background:#ef4444" onclick="handleInput(0)">🐱</button>
    <button class="btn" id="btn-1" style="background:#3b82f6" onclick="handleInput(1)">🐶</button>
    <button class="btn" id="btn-2" style="background:#22c55e" onclick="handleInput(2)">🐦</button>
    <button class="btn" id="btn-3" style="background:#eab308" onclick="handleInput(3)">🔔</button>
  </div>
</div>

<script>
    // GhorbaniKids Score Submission Protocol
    function gkSendScore(finalScore) {
        try {
            var sc = parseInt(finalScore) || 0;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'GK_SUBMIT_SCORE',
                    score: sc
                }, '*');
            }
        } catch(e) { console.error('GK postMessage error:', e); }
    }
    
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let state = { level: 1, score: 0, sequence: [], playerIndex: 0, isPlaying: false };

  // ===== ساخت صداهای واقعی‌تر با Web Audio API (بدون نیاز به فایل خارجی) =====

  function now() { return audioCtx.currentTime; }

  // 🐱 صدای گربه (میو): یک گلایید فرکانسی بالارونده و پایین‌آینده با فرم موج sawtooth
  function playCat() {
    const t = now();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, t);
    osc.frequency.linearRampToValueAtTime(900, t + 0.12);
    osc.frequency.linearRampToValueAtTime(500, t + 0.32);
    osc.frequency.linearRampToValueAtTime(650, t + 0.42);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1200;
    filter.Q.value = 2;

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);

    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.5);
  }

  // 🐶 صدای سگ (پارس): دو ضربه کوتاه با نویز پایین + فرکانس افت‌کننده
  function playDog() {
    const t = now();
    for (const offset of [0, 0.18]) {
      const st = t + offset;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, st);
      osc.frequency.exponentialRampToValueAtTime(90, st + 0.13);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 800;

      gain.gain.setValueAtTime(0.0001, st);
      gain.gain.exponentialRampToValueAtTime(0.3, st + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.15);

      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(st); osc.stop(st + 0.16);
    }
  }

  // 🐦 صدای پرنده (جیک‌جیک): چند چیرپ کوتاه با فرکانس بالا
  function playBird() {
    const t = now();
    const chirps = [0, 0.09, 0.18];
    for (const offset of chirps) {
      const st = t + offset;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2200, st);
      osc.frequency.exponentialRampToValueAtTime(3400, st + 0.05);
      osc.frequency.exponentialRampToValueAtTime(2000, st + 0.08);

      gain.gain.setValueAtTime(0.0001, st);
      gain.gain.exponentialRampToValueAtTime(0.18, st + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.09);

      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(st); osc.stop(st + 0.1);
    }
  }

  // 🔔 صدای زنگوله: فرکانس اصلی + هارمونیک‌ها با محو تدریجی طولانی (شبیه فلز)
  function playBell() {
    const t = now();
    const fundamental = 880;
    const harmonics = [1, 2.4, 3.1, 4.2];
    const master = audioCtx.createGain();
    master.gain.value = 0.22;
    master.connect(audioCtx.destination);

    harmonics.forEach((ratio, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = fundamental * ratio;
      const amp = 0.5 / (i + 1);
      gain.gain.setValueAtTime(amp, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      osc.connect(gain); gain.connect(master);
      osc.start(t); osc.stop(t + 1.1);
    });
  }

  const soundPlayers = [playCat, playDog, playBird, playBell];

  function playSound(index) {
    soundPlayers[index]();

    // انیمیشن دکمه
    const btn = document.getElementById(`btn-${index}`);
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 300);
  }

  async function playSequence() {
    state.isPlaying = false;
    for (let i of state.sequence) {
      await new Promise(r => setTimeout(r, 700));
      playSound(i);
    }
    state.isPlaying = true;
    state.playerIndex = 0;
  }

  function handleInput(index) {
    if (!state.isPlaying) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playSound(index);

    if (index === state.sequence[state.playerIndex]) {
      state.playerIndex++;
      if (state.playerIndex === state.sequence.length) {
        state.score += 10;
        document.getElementById('score').innerText = state.score;
        showLevelToast();
        setTimeout(nextLevel, 1500);
      }
    } else {
      gameOver();
    }
  }

  function showLevelToast() {
    const toast = document.getElementById('level-toast');
    document.getElementById('level-toast-text').innerText = `مرحله ${state.level} تموم شد`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1300);
  }

  function nextLevel() {
    state.isPlaying = false;
    state.level++;
    document.getElementById('level').innerText = state.level;
    state.sequence.push(Math.floor(Math.random() * 4));
    playSequence();
  }

  function startGame() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('start-screen').classList.add('hidden');
    state = { level: 1, score: 0, sequence: [Math.floor(Math.random() * 4)], playerIndex: 0 };
    document.getElementById('score').innerText = 0;
    document.getElementById('level').innerText = 1;
    playSequence();
  }

  function gameOver() { 
    try { gkSendScore(state.score); } catch(e){} 
    state.isPlaying = false;
    alert('اوخ! یادت رفت. امتیاز نهایی: ' + state.score);
    document.getElementById('start-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
