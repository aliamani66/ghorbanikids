<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدول دوستی و ترکیب‌ها - فارسی اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(219,39,119,0.25); border: 4px solid #fbcfe8; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #fce7f3; color: #be185d; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .equation-box { background: #fff1f2; border: 3px dashed #f43f5e; border-radius: 22px; padding: 20px; display: flex; justify-content: center; align-items: center; gap: 14px; }
        .letter-card { width: 68px; height: 68px; background: #ffffff; border: 3px solid #fb7185; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; color: #be123c; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .plus-sign { font-size: 2rem; font-weight: 900; color: #e11d48; }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #fbcfe8; border-radius: 20px; padding: 14px; font-size: 2.2rem; font-weight: 900; color: #9d174d; cursor: pointer; text-align: center; transition: all 0.2s; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #db2777, #be185d); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">📖 فارسی اول: جدول دوستی و ترکیب‌ها</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <p style="text-align:center; color:#9d174d; font-weight:800; font-size:1.05rem;">این دو نشانه با هم دوست بشوند چه صدایی می‌سازند؟</p>

        <div class="equation-box">
            <div class="letter-card" id="c1">بـ</div>
            <div class="plus-sign">+</div>
            <div class="letter-card" id="c2">ا</div>
            <div class="plus-sign">=</div>
            <div class="letter-card" style="border-style:dashed; color:#db2777;" id="targetAns">؟</div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🤝🌸</div>
            <h2 style="color:#9d174d; font-size:1.6rem; font-weight:900;">آفرین دوست نشانه‌ها!</h2>
            <p style="color:#475569; font-weight:700;">تمام ترکیب‌های جدول دوستی را عالی یاد گرفتی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(180, 'sawtooth', 0.2); }
        function sndWin() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 120)); }

        const pairs = [
            { c1: 'بـ', c2: 'ا', ans: 'با', wrong: ['بو', 'بیـ'] },
            { c1: 'سـ', c2: 'او', ans: 'سو', wrong: ['سا', 'سیـ'] },
            { c1: 'مـ', c2: 'ا', ans: 'ما', wrong: ['مو', 'میـ'] },
            { c1: 'تـ', c2: 'او', ans: 'تو', wrong: ['تا', 'تیـ'] },
            { c1: 'د', c2: 'ا', ans: 'دا', wrong: ['دو', 'دی'] },
            { c1: 'ر', c2: 'او', ans: 'رو', wrong: ['را', 'ری'] },
            { c1: 'نـ', c2: 'ا', ans: 'نا', wrong: ['نو', 'نیـ'] },
            { c1: 'سـ', c2: 'ا', ans: 'سا', wrong: ['سو', 'سیـ'] }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const p = pairs[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            document.getElementById('c1').textContent = p.c1;
            document.getElementById('c2').textContent = p.c2;
            document.getElementById('targetAns').textContent = '؟';

            let opts = [p.ans, ...p.wrong].sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const p = pairs[currentIdx];

            if(chosen === p.ans) {
                sndCorrect();
                btn.classList.add('correct');
                document.getElementById('targetAns').textContent = p.ans;
                score += 12;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < pairs.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
