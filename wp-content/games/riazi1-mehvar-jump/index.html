<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پرش قورباغه روی محور اعداد - ریاضی اول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(16,185,129,0.25); border: 4px solid #a7f3d0; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #d1fae5; color: #047857; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .equation-box { background: #f0fdf4; border: 3px solid #86efac; border-radius: 20px; padding: 16px; text-align: center; font-size: 2.2rem; font-weight: 900; color: #065f46; letter-spacing: 4px; }
        .axis-container { width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 24px 10px 14px 10px; position: relative; }
        .axis-line { width: 100%; height: 6px; background: #059669; border-radius: 3px; position: relative; margin-top: 20px; }
        .axis-ticks { display: flex; justify-content: space-between; position: relative; top: -14px; }
        .tick { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 0.9rem; color: #334155; }
        .tick-mark { width: 4px; height: 14px; background: #059669; border-radius: 2px; }
        .frog { position: absolute; font-size: 2rem; top: -28px; transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateX(-50%); }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #cbd5e1; border-radius: 18px; padding: 14px; font-size: 1.8rem; font-weight: 900; color: #0f172a; cursor: pointer; text-align: center; transition: all 0.2s; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🧮 ریاضی اول: محور اعداد و جمع</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <div class="equation-box" id="equationDisplay">۳ + ۲ = ؟</div>

        <div class="axis-container">
            <div class="frog" id="frogElem" style="left: 0%;">🐸</div>
            <div class="axis-line"></div>
            <div class="axis-ticks" id="ticksContainer"></div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🐸✨</div>
            <h2 style="color:#065f46; font-size:1.6rem; font-weight:900;">آفرین قورباغه دانا!</h2>
            <p style="color:#475569; font-weight:700;">جمع و تفریق روی محور اعداد را عالی یاد گرفتی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(587.33, 'triangle', 0.15); setTimeout(()=>playTone(783.99, 'triangle', 0.25), 100); }
        function sndWrong() { playTone(180, 'sawtooth', 0.2); }
        function sndWin() { [500, 650, 750, 900].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.25), i * 120)); }

        const questions = [
            { a: 2, b: 3, op: '+', ans: 5 },
            { a: 4, b: 2, op: '+', ans: 6 },
            { a: 7, b: 3, op: '-', ans: 4 },
            { a: 5, b: 4, op: '+', ans: 9 },
            { a: 8, b: 5, op: '-', ans: 3 },
            { a: 6, b: 2, op: '+', ans: 8 },
            { a: 9, b: 4, op: '-', ans: 5 },
            { a: 3, b: 7, op: '+', ans: 10 }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function renderTicks() {
            const container = document.getElementById('ticksContainer');
            container.innerHTML = '';
            for(let i=0; i<=10; i++) {
                const t = document.createElement('div');
                t.className = 'tick';
                t.innerHTML = `<div class="tick-mark"></div><span>${toPersian(i)}</span>`;
                container.appendChild(t);
            }
        }

        function loadQuestion() {
            canClick = true;
            const q = questions[currentIdx];
            document.getElementById('equationDisplay').textContent = `${toPersian(q.a)} ${q.op} ${toPersian(q.b)} = ؟`;
            document.getElementById('scoreVal').textContent = toPersian(score);

            // Move frog to start
            const pct = (q.a / 10) * 100;
            document.getElementById('frogElem').style.left = `${pct}%`;

            let wrong = new Set();
            while(wrong.size < 2) {
                let r = Math.floor(Math.random() * 10) + 1;
                if(r !== q.ans) wrong.add(r);
            }
            let opts = [q.ans, ...Array.from(wrong)].sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = toPersian(opt);
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const q = questions[currentIdx];

            if(chosen === q.ans) {
                sndCorrect();
                btn.classList.add('correct');
                score += 12;
                document.getElementById('scoreVal').textContent = toPersian(score);
                document.getElementById('frogElem').style.left = `${(q.ans / 10) * 100}%`;
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < questions.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 900);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        renderTicks();
        loadQuestion();
    </script>
</body>
</html>
