<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کارخانه الگوهای رنگی و شطرنجی - ریاضی اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(192,38,211,0.25); border: 4px solid #f5d0fe; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #fae8ff; color: #a21caf; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #c026d3, #e879f9); width: 10%; transition: width 0.3s; }
        .pattern-box { background: #faf5ff; border: 3px dashed #d8b4fe; border-radius: 22px; padding: 20px 10px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
        .cell { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .cell.target { border: 3px dashed #9333ea; background: #ffffff; font-size: 1.8rem; font-weight: 900; color: #9333ea; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #f3e8ff; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: all 0.2s; min-height: 75px; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; transform: scale(1.08); }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #c026d3, #9333ea); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🧮 ریاضی اول: الگوهای شطرنجی و رنگی</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
        
        <p style="text-align:center; color:#6b21a8; font-weight:800; font-size:1.05rem;">جای علامت سؤال چه شکلی قرار می‌گیرد؟</p>
        
        <div class="pattern-box" id="patternBox"></div>
        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🎉</div>
            <h2 style="color:#86198f; font-size:1.6rem; font-weight:900;">آفرین معمار الگوها!</h2>
            <p style="color:#475569; font-weight:700;">تمام الگوهای ریاضی را با دقت کامل کشف کردی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523.25, 'sine', 0.12); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); }
        function sndWrong() { playTone(200, 'sawtooth', 0.2); }
        function sndWin() { [400, 500, 600, 800].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 130)); }

        const patterns = [
            { seq: ['🔴','🔵','🔴','🔵','🔴'], ans: '🔵', pool: ['🔵','🔴','🟡','🟢'] },
            { seq: ['🔺','🟩','🔺','🟩','🔺'], ans: '🟩', pool: ['🟩','🔺','🟡','🔷'] },
            { seq: ['🟡','🟡','🟣','🟡','🟡'], ans: '🟣', pool: ['🟣','🟡','🔴','🟢'] },
            { seq: ['⭐','🌙','⭐','🌙','⭐'], ans: '🌙', pool: ['🌙','⭐','☀️','☁️'] },
            { seq: ['🟦','🟧','🟨','🟦','🟧'], ans: '🟨', pool: ['🟨','🟦','🟧','🟩'] },
            { seq: ['🍎','🍌','🍎','🍌','🍎'], ans: '🍌', pool: ['🍌','🍎','🍇','🍊'] },
            { seq: ['🚗','🚕','🚙','🚗','🚕'], ans: '🚙', pool: ['🚙','🚗','🚕','🏎️'] },
            { seq: ['🌸','🍀','🌸','🍀','🌸'], ans: '🍀', pool: ['🍀','🌸','🌻','🍁'] }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const p = patterns[currentIdx];
            document.getElementById('progFill').style.width = ((currentIdx + 1) / patterns.length * 100) + '%';
            document.getElementById('scoreVal').textContent = toPersian(score);

            const box = document.getElementById('patternBox');
            box.innerHTML = '';
            p.seq.forEach(item => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = item;
                box.appendChild(cell);
            });
            const targetCell = document.createElement('div');
            targetCell.className = 'cell target';
            targetCell.textContent = '؟';
            box.appendChild(targetCell);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            p.pool.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = item;
                btn.onclick = () => checkAnswer(item, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const p = patterns[currentIdx];
            if(chosen === p.ans) {
                sndCorrect();
                btn.classList.add('correct');
                score += 12;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < patterns.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
