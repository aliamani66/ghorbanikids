<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>چینش میوه‌ها | Fruit Bowl Memory</title>
  <style>
    :root {
      --bg: #1a0b2e;
      --plate: #f0f0f0;
      --accent: #ff007f;
    }
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: white; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; overflow: hidden;
    }
    
    #game-container {
      width: 100vw; max-width: 480px;
      height: 100vh; height: 100dvh; max-height: 850px;
      background: radial-gradient(circle at center, #2d1b4e, #1a0b2e);
      position: relative; display: flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .top-stats { flex-shrink: 0; display: flex; justify-content: space-between; width: 100%; padding: 14px 20px; font-weight: bold; }
    
    .plate-area { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; padding: 10px; overflow: hidden; }
    
    .slots-container { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 14px; perspective: 1000px; width: 100%; max-height: 100%; overflow: auto; }
    
    .slot {
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(0,0,0,0.35) 70%);
      border-radius: 50%;
      border: 3px dashed rgba(255,255,255,0.25);
      display: flex; justify-content: center; align-items: center;
      transition: all 0.3s; cursor: pointer;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.4), 0 6px 14px rgba(0,0,0,0.35);
      line-height: 1;
    }
    
    .slot.active { border-style: solid; border-color: var(--accent); box-shadow: 0 0 18px rgba(255,0,127,0.6), inset 0 4px 10px rgba(0,0,0,0.4); }

    .fruit-selector {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(0,0,0,0.2); width: 100%;
    }
    
    .fruit-btn {
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), rgba(255,255,255,0.04) 70%);
      border: 2px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 8px; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      font-size: 2.1rem; transition: 0.2s; box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    }
    .fruit-btn:active { transform: scale(0.9); }

    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; }
    .btn-main { background: var(--accent); color: white; padding: 15px 40px; border: none; border-radius: 30px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; font-weight: bold; }
    
    #message-box { font-size: 1.5rem; margin-bottom: 20px; color: #ffeb3b; }
    .hidden { display: none; }
    canvas { pointer-events: none; position: absolute; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="particle-canvas"></canvas>
  
  <div id="start-screen" class="overlay">
    <h1>چینش میوه‌ها</h1>
    <p>جایگاه میوه‌ها رو به خاطر بسپار و بعد درست بچینشون!</p>
    <button class="btn-main" onclick="startGame()">شروع بازی</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 id="result-msg">پایان!</h1>
    <button class="btn-main" onclick="startGame()">بازی مجدد</button>
  </div>

  <div class="top-stats">
    <div>مرحله: <span id="level">1</span></div>
    <div>امتیاز: <span id="score">0</span></div>
  </div>

  <div class="plate-area">
    <div id="slots" class="slots-container"></div>
  </div>

  <div id="controls" class="fruit-selector">
    <button class="fruit-btn" onclick="selectFruit('🍎')">🍎</button>
    <button class="fruit-btn" onclick="selectFruit('🍌')">🍌</button>
    <button class="fruit-btn" onclick="selectFruit('🍇')">🍇</button>
    <button class="fruit-btn" onclick="selectFruit('🍊')">🍊</button>
  </div>
</div>

<script>
    // GhorbaniKids Score Submission Protocol
    function gkSendScore(finalScore) {
        try {
            var sc = parseInt(finalScore) || 0;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'GK_SUBMIT_SCORE',
                    score: sc
                }, '*');
            }
        } catch(e) { console.error('GK postMessage error:', e); }
    }
    
  let state = { level: 1, score: 0, sequence: [], userSequence: [], mode: 'MEMORIZE', activeSlot: 0 };
  const fruits = ['🍎', '🍌', '🍇', '🍊'];
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(type === 'correct' ? 600 : 200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }

  function initLevel() {
    state.mode = 'MEMORIZE';
    state.sequence = Array.from({ length: 2 + Math.floor(state.level/2) }, () => fruits[Math.floor(Math.random() * fruits.length)]);
    state.userSequence = Array(state.sequence.length).fill(null);
    renderSlots();
    showMemorize();
  }

  function renderSlots() {
    const container = document.getElementById('slots');
    container.innerHTML = '';

    const count = state.sequence.length;
    const gap = 14;
    const maxPerRow = count <= 6 ? count : Math.ceil(count / 2);
    const rows = Math.ceil(count / maxPerRow);
    const availableWidth = container.parentElement.clientWidth - 20;
    const availableHeight = container.parentElement.clientHeight - 20;

    let slotSizeByWidth = Math.floor((availableWidth - gap * (maxPerRow - 1)) / maxPerRow);
    let slotSizeByHeight = Math.floor((availableHeight - gap * (rows - 1)) / rows);
    let slotSize = Math.min(slotSizeByWidth, slotSizeByHeight);
    slotSize = Math.max(40, Math.min(100, slotSize));
    const fontSize = Math.floor(slotSize * 0.62);

    state.sequence.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'slot';
      div.id = `slot-${i}`;
      div.style.width = slotSize + 'px';
      div.style.height = slotSize + 'px';
      div.style.fontSize = fontSize + 'px';
      div.onclick = () => state.mode === 'RECONSTRUCT' && (state.activeSlot = i);
      container.appendChild(div);
    });
  }

  function showMemorize() {
    state.sequence.forEach((f, i) => {
      document.getElementById(`slot-${i}`).innerText = f;
    });
    setTimeout(() => {
      state.sequence.forEach((f, i) => document.getElementById(`slot-${i}`).innerText = '');
      state.mode = 'RECONSTRUCT';
    }, 2000 + (state.level * 200));
  }

  function selectFruit(fruit) {
    if (state.mode !== 'RECONSTRUCT') return;
    state.userSequence[state.activeSlot] = fruit;
    document.getElementById(`slot-${state.activeSlot}`).innerText = fruit;
    
    state.activeSlot = (state.activeSlot + 1) % state.sequence.length;
    
    if (!state.userSequence.includes(null)) checkResult();
  }

  function checkResult() {
    const isCorrect = state.userSequence.every((val, i) => val === state.sequence[i]);
    if (isCorrect) {
      playSound('correct');
      state.score += 100 * state.level;
      state.level++;
      document.getElementById('score').innerText = state.score;
      document.getElementById('level').innerText = state.level;
      initLevel();
    } else {
      playSound('wrong');
      try { gkSendScore(state.score); } catch(e){}
      document.getElementById('result-msg').innerText = "اشتباه بود! امتیاز شما: " + state.score;
      document.getElementById('gameover-screen').classList.remove('hidden');
    }
  }

  function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    state.score = 0; state.level = 1;
    initLevel();
  }

  window.addEventListener('resize', () => {
    if (state.sequence.length) renderSlots();
  });
</script>
</body>
</html>
