<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پوشش جانوران - علوم اول دبستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, 'Vazirmatn', sans-serif; }
        body { background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
        .game-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(202,138,4,0.25); border: 4px solid #fde047; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #fef9c3; color: #854d0e; font-weight: 800; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .score-box { background: #fef08a; color: #854d0e; font-weight: 900; font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; border: 2px solid #facc15; }
        .animal-box { background: #fffbeb; border: 3px solid #facc15; border-radius: 22px; padding: 20px; text-align: center; }
        .animal-icon { font-size: 4.5rem; }
        .animal-name { font-size: 2rem; font-weight: 900; color: #713f12; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
        .opt-btn { background: #ffffff; border: 3px solid #fef08a; border-radius: 20px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.25rem; font-weight: 900; color: #713f12; cursor: pointer; transition: all 0.2s; min-height: 70px; }
        .opt-btn:active { transform: scale(0.92); }
        .opt-btn.correct { background: #dcfce7; border-color: #22c55e; }
        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; }
        .modal { position: absolute; inset: 0; background: rgba(255,255,255,0.96); border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 10; }
        .modal.active { display: flex; }
        .btn-restart { background: linear-gradient(135deg, #eab308, #ca8a04); color: #fff; border: none; padding: 14px 32px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="header">
            <div class="badge">🔬 علوم اول: دنیای جانوران</div>
            <div class="score-box">⭐ امتیاز: <span id="scoreVal">۰</span></div>
        </div>

        <p style="text-align:center; color:#854d0e; font-weight:800; font-size:1.05rem;">پوشش بدن این جانور چیست؟</p>

        <div class="animal-box">
            <div class="animal-icon" id="animalIcon">🦅</div>
            <div class="animal-name" id="animalName">عقاب تیزپرواز</div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="modal" id="endModal">
            <div style="font-size:4rem;">🦁🦅🐟</div>
            <h2 style="color:#713f12; font-size:1.6rem; font-weight:900;">استاد دنیای جانوران!</h2>
            <p style="color:#475569; font-weight:700;">پوشش تمام حیوانات را به درستی دسته‌بندی کردی!</p>
            <div style="font-size:1.4rem; font-weight:900; color:#059669;">امتیاز نهایی: <span id="finalScoreVal">۱۰۰</span></div>
            <button class="btn-restart" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function sndCorrect() { playTone(523, 'sine', 0.12); setTimeout(()=>playTone(659, 'sine', 0.2), 100); }
        function sndWrong() { playTone(180, 'sawtooth', 0.2); }
        function sndWin() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 120)); }

        const animals = [
            { icon: '🦅', name: 'عقاب', ans: '🪶 پر', pool: ['🪶 پر', '🐟 پولک', '🐑 پشم و مو', '🛡️ لاک'] },
            { icon: '🐟', name: 'ماهی قزل‌آلا', ans: '🐟 پولک', pool: ['🐟 پولک', '🪶 پر', '🐑 پشم و مو', '🛡️ لاک'] },
            { icon: '🐑', name: 'گوسفند', ans: '🐑 پشم و مو', pool: ['🐑 پشم و مو', '🪶 پر', '🐟 پولک', '🛡️ لاک'] },
            { icon: '🐢', name: 'لاک‌پشت', ans: '🛡️ لاک محکم', pool: ['🛡️ لاک محکم', '🪶 پر', '🐟 پولک', '🐑 پشم و مو'] },
            { icon: '🦆', name: 'اردک زیبا', ans: '🪶 پر', pool: ['🪶 پر', '🐟 پولک', '🐑 پشم و مو', '🛡️ لاک محکم'] },
            { icon: '🐻', name: 'خرس قهوه‌ای', ans: '🐑 پشم و مو', pool: ['🐑 پشم و مو', '🪶 پر', '🐟 پولک', '🛡️ لاک محکم'] }
        ];

        let currentIdx = 0;
        let score = 0;
        let canClick = true;

        function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

        function loadQuestion() {
            canClick = true;
            const a = animals[currentIdx];
            document.getElementById('scoreVal').textContent = toPersian(score);
            document.getElementById('animalIcon').textContent = a.icon;
            document.getElementById('animalName').textContent = a.name;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            a.pool.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            if(!canClick) return;
            canClick = false;
            const a = animals[currentIdx];

            if(chosen === a.ans) {
                sndCorrect();
                btn.classList.add('correct');
                score += 16;
                document.getElementById('scoreVal').textContent = toPersian(score);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < animals.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                sndWrong();
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    canClick = true;
                }, 600);
            }
        }

        function endGame() {
            sndWin();
            document.getElementById('finalScoreVal').textContent = toPersian(score);
            document.getElementById('endModal').classList.add('active');
            if (window.parent) {
                window.parent.postMessage({ type: 'GK_SUBMIT_SCORE', score: score }, '*');
            }
        }

        function restartGame() {
            currentIdx = 0;
            score = 0;
            document.getElementById('endModal').classList.remove('active');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
