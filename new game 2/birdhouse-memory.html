<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حافظه لانه پرندگان</title>
  <style>
    :root {
      --bg-top: #74ebd5;
      --bg-bottom: #9face6;
      --wood-dark: #6d4c41;
      --wood-light: #8d6e63;
      --wood-border: #4e342e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 900px;
      max-width: 95vw;
      height: 600px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(10px, 3vw, 24px);
      overflow: hidden;
    }

    /* هدر و نمایشگر وضعیت */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #2c3e50;
      font-size: 1.15rem;
    }

    .badge {
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* صحنه لانه‌ها */
    .scene {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 1.8vw, 24px);
      width: 100%;
      flex-grow: 1;
      perspective: 1000px;
    }

    .birdhouse {
      --hw: clamp(46px, 14vw, 130px);
      position: relative;
      width: var(--hw);
      height: calc(var(--hw) * 1.46);
      background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
      border: 4px solid var(--wood-border);
      border-radius: 16px 16px 8px 8px;
      box-shadow: 0 12px 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 1;
      min-width: 0;
    }

    .birdhouse::before {
      content: '';
      position: absolute;
      top: calc(var(--hw) * -0.23);
      width: 0;
      height: 0;
      border-left: calc(var(--hw) * 0.58) solid transparent;
      border-right: calc(var(--hw) * 0.58) solid transparent;
      border-bottom: calc(var(--hw) * 0.246) solid var(--wood-border);
    }

    .birdhouse.highlight {
      transform: scale(1.08);
      box-shadow: 0 0 25px #f1c40f, 0 15px 30px rgba(0,0,0,0.3);
      border-color: #f39c12;
    }

    .hole {
      position: relative;
      width: calc(var(--hw) * 0.65);
      height: calc(var(--hw) * 0.65);
      background: #2b1d0c;
      border: 4px solid var(--wood-border);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bird {
      width: calc(var(--hw) * 0.46);
      height: calc(var(--hw) * 0.46);
      transition: transform 0.4s ease-out, opacity 0.3s;
    }

    .bird.peeking {
      animation: birdPeek 1.5s ease-in-out infinite alternate;
    }

    @keyframes birdPeek {
      0% { transform: translateY(8px) scale(0.95); }
      100% { transform: translateY(-2px) scale(1.05); }
    }

    /* در لانه با چرخش سه بعدی */
    .door {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #a1887f;
      border-radius: 50%;
      transform-origin: right center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .door.closed {
      transform: rotateY(0deg);
    }

    .door.open {
      transform: rotateY(-110deg);
    }

    /* پنل پاسخ‌دهی و انتخاب رنگ */
    .prompt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 90px;
    }

    .prompt-text {
      font-size: 1.25rem;
      font-weight: 800;
      color: #2c3e50;
      text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    }

    .palette {
      display: flex;
      gap: 16px;
    }

    .palette-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .palette-btn:hover {
      transform: scale(1.15) translateY(-4px);
    }

    .palette-btn:active {
      transform: scale(0.95);
    }

    /* لایه منو و شروع */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(44, 62, 80, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      border-radius: 28px;
      color: white;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      padding: 14px 44px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: scale(1.06);
      box-shadow: 0 14px 30px rgba(46, 204, 113, 0.6);
    }

    #confetti-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- نوار وضعیت -->
    <div class="status-bar">
      <div class="badge">مرحله: <span id="level-lbl">۱</span></div>
      <div class="badge">امتیاز: <span id="score-lbl">۰</span></div>
      <div class="badge">فرصت: <span id="lives-lbl">❤️❤️❤️</span></div>
    </div>

    <!-- صحنه بازی -->
    <div class="scene" id="scene"></div>

    <!-- بخش پرسش و انتخاب رنگ -->
    <div class="prompt-container">
      <div class="prompt-text" id="prompt-msg">پرندگان را به خاطر بسپارید...</div>
      <div class="palette" id="palette"></div>
    </div>

    <!-- صفحه ورود / باخت -->
    <div class="overlay" id="overlay">
      <h1 style="font-size: 2.4rem;">🐦 حافظه لانه پرندگان</h1>
      <p style="max-width: 400px; line-height: 1.6; color: #ecf0f1;">
        جایگاه پرندگان رنگی را قبل از بسته شدن درها به یاد بسپارید و با رسیدن به مراحل بالا حافظه دیداری خود را به چالش بکشید!
      </p>
      <button class="btn-primary" id="start-btn">شروع بازی</button>
    </div>
  </div>

  <script>
    // تنظیمات و لیست رنگ پرندگان
    const BIRD_COLORS = [
      { name: 'قرمز', hex: '#e74c3c', svg: createBirdSVG('#e74c3c') },
      { name: 'آبی', hex: '#3498db', svg: createBirdSVG('#3498db') },
      { name: 'زرد', hex: '#f1c40f', svg: createBirdSVG('#f1c40f') },
      { name: 'سبز', hex: '#2ecc71', svg: createBirdSVG('#2ecc71') },
      { name: 'بنفش', hex: '#9b59b6', svg: createBirdSVG('#9b59b6') }
    ];

    function createBirdSVG(color) {
      return `
        <svg class="bird peeking" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="35" fill="${color}" stroke="#2c3e50" stroke-width="4"/>
          <circle cx="38" cy="42" r="6" fill="#fff"/>
          <circle cx="36" cy="42" r="3" fill="#000"/>
          <polygon points="15,48 32,42 32,54" fill="#e67e22"/>
          <path d="M 55 52 Q 75 60 70 42" stroke="#2c3e50" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      `;
    }

    // موتور صوتی سنتز شده با Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundChirp() {
      playTone(850, 'triangle', 0.1, 0.15);
      setTimeout(() => playTone(1200, 'sine', 0.15, 0.15), 60);
    }

    function soundDoor() {
      playTone(180, 'sawtooth', 0.12, 0.2);
    }

    function soundCorrect() {
      playTone(523.25, 'triangle', 0.15, 0.12);
      setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.12), 100);
      setTimeout(() => playTone(783.99, 'triangle', 0.25, 0.15), 200);
    }

    function soundWrong() {
      playTone(220, 'sawtooth', 0.2, 0.2);
      setTimeout(() => playTone(165, 'sawtooth', 0.3, 0.25), 150);
    }

    // متغیرهای وضعیت بازی
    let level = 1;
    let score = 0;
    let lives = 3;
    let currentHouses = [];
    let targetIndex = 0;
    let isAnswering = false;

    const sceneEl = document.getElementById('scene');
    const paletteEl = document.getElementById('palette');
    const promptMsg = document.getElementById('prompt-msg');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');

    startBtn.onclick = () => {
      overlay.style.display = 'none';
      initGame();
    };

    function initGame() {
      level = 1;
      score = 0;
      lives = 3;
      updateUI();
      startRound();
    }

    function updateUI() {
      document.getElementById('level-lbl').innerText = level;
      document.getElementById('score-lbl').innerText = score;
      document.getElementById('lives-lbl').innerText = '❤️'.repeat(lives);
    }

    function startRound() {
      isAnswering = false;
      paletteEl.innerHTML = '';
      promptMsg.innerText = 'خوب به لانه‌ها دقت کنید...';

      // تعیین تعداد لانه‌ها بر اساس مرحله (۳ تا ۵)
      const houseCount = level >= 5 ? 5 : (level >= 3 ? 4 : 3);
      const memorizationTime = Math.max(1600, 3500 - level * 250);

      // انتخاب تصادفی پرندگان بدون تکرار مستقیم
      const shuffledColors = [...BIRD_COLORS].sort(() => 0.5 - Math.random());
      currentHouses = shuffledColors.slice(0, houseCount);

      // تولید المان‌های بصری لانه‌ها
      sceneEl.innerHTML = '';
      currentHouses.forEach((bird, idx) => {
        const house = document.createElement('div');
        house.className = 'birdhouse';
        house.id = `house-${idx}`;
        house.innerHTML = `
          <div class="hole">
            ${bird.svg}
            <div class="door open" id="door-${idx}"></div>
          </div>
        `;
        sceneEl.appendChild(house);
      });

      soundChirp();

      // بستن درها پس از اتمام زمان نمایش
      setTimeout(() => {
        for (let i = 0; i < houseCount; i++) {
          document.getElementById(`door-${i}`).classList.remove('open');
          document.getElementById(`door-${i}`).classList.add('closed');
        }
        soundDoor();
        promptMsg.innerText = 'درها بسته شدند!';

        // مرحله چالش: انتخاب لانه مورد نظر برای پرسش
        setTimeout(() => triggerChallenge(houseCount), 800);
      }, memorizationTime);
    }

    function triggerChallenge(count) {
      targetIndex = Math.floor(Math.random() * count);
      const targetHouse = document.getElementById(`house-${targetIndex}`);
      targetHouse.classList.add('highlight');

      promptMsg.innerText = 'چه پرنده‌ای در این لانه بود؟';
      isAnswering = true;

      // ساخت دکمه‌های پالت رنگ با ترتیبی متفاوت از چیدمان لانه‌ها
      paletteEl.innerHTML = '';
      const shuffledPalette = [...currentHouses].sort(() => 0.5 - Math.random());
      shuffledPalette.forEach(bird => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.style.backgroundColor = bird.hex;
        btn.onclick = () => handleAnswer(bird);
        paletteEl.appendChild(btn);
      });
    }

    function handleAnswer(selectedBird) {
      if (!isAnswering) return;
      isAnswering = false;

      const correctBird = currentHouses[targetIndex];
      const targetDoor = document.getElementById(`door-${targetIndex}`);
      targetDoor.classList.remove('closed');
      targetDoor.classList.add('open');

      if (selectedBird.hex === correctBird.hex) {
        soundCorrect();
        score += 100 * level;
        promptMsg.innerText = '✨ آفرین! درست حدس زدی.';
        triggerConfetti();
        level++;
        updateUI();
        setTimeout(startRound, 1800);
      } else {
        soundWrong();
        lives--;
        promptMsg.innerText = `❌ اشتباه بود! پرنده ${correctBird.name} بود.`;
        updateUI();

        if (lives <= 0) {
          setTimeout(showGameOver, 1500);
        } else {
          setTimeout(startRound, 1800);
        }
      }
    }

    function showGameOver() {
      overlay.style.display = 'flex';
      overlay.querySelector('h1').innerText = 'بازی تمام شد!';
      overlay.querySelector('p').innerText = `مجموع امتیاز شما: ${score} | آخرین مرحله: ${level}`;
      startBtn.innerText = 'تلاش دوباره';
    }

    // افکت ذرات پیروزی (Confetti)
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const pieces = Array.from({ length: 45 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12 - 4,
        size: Math.random() * 8 + 4,
        color: ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'][Math.floor(Math.random() * 5)]
      }));

      let frame = 0;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25; // جاذبه
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (++frame < 50) requestAnimationFrame(render);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      render();
    }
  </script>
</body>
</html>
