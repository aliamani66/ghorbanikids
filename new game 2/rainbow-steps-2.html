<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ردپای رنگین‌کمان | Rainbow Steps</title>
  <style>
    :root {
      --water-deep: #0a3d62;
      --water-mid: #1e6f9f;
      --water-light: #60a3bc;
      --text-main: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b4d3e 0%, #081c15 100%);
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 760px;
      max-width: 96vw;
      height: 580px;
      max-height: 94vh;
      background: rgba(10, 30, 45, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      overflow: hidden;
    }

    /* نوار بالایی وضعیت */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      color: var(--text-main);
      font-size: 1rem;
      z-index: 5;
    }

    .badge {
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* نوار پیشرفت پیشرفته مرحله */
    .progress-wrapper {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px;
      z-index: 5;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9b59b6);
      background-size: 300% 100%;
      animation: rainbowFlow 4s linear infinite;
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes rainbowFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* محیط رودخانه و آب متحرک */
    .river-stage {
      position: relative;
      width: 100%;
      height: 330px;
      border-radius: 20px;
      background: linear-gradient(180deg, var(--water-deep) 0%, var(--water-mid) 60%, var(--water-light) 100%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 800px;
    }

    /* امواج متحرک آب */
    .water-wave {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 10%, transparent 20%);
      background-size: 30px 30px;
      animation: waveDrift 18s linear infinite;
      pointer-events: none;
    }

    @keyframes waveDrift {
      from { transform: translateY(-20%) rotate(0deg); }
      to { transform: translateY(20%) rotate(360deg); }
    }

    /* چیدمان سنگ‌های رودخانه - همیشه ۴ ستون تا در هر تعداد سنگ جا شود */
    .stepping-stones-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: min-content;
      gap: 12px 14px;
      z-index: 4;
      padding: 10px;
      width: 100%;
      justify-items: center;
    }

    /* ساختار سنگ سه‌بعدی - کوچک‌تر تا همه در صفحه جا شوند */
    .stone-wrap {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stone {
      position: relative;
      width: 62px;
      height: 56px;
      border-radius: 46% 54% 50% 50% / 55% 50% 50% 45%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      /* سایه واقعی سنگ روی سطح آب */
      filter: drop-shadow(0 8px 6px rgba(0,0,0,0.45));
    }

    /* حجم سه‌بعدی سنگ با چند لایه گرادیان: نور از بالا-چپ، سایه در پایین-راست */
    .stone {
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 30%),
        linear-gradient(155deg, #4b5568 0%, #333a47 45%, #20242e 100%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        inset -6px -8px 10px rgba(0,0,0,0.55),
        inset 4px 5px 8px rgba(255,255,255,0.15),
        0 3px 4px rgba(0,0,0,0.3);
    }

    /* رگه‌های ریز سنگ برای بافت طبیعی‌تر */
    .stone::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 70% 75%, rgba(0,0,0,0.25) 0%, transparent 35%),
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.12) 0%, transparent 25%);
      pointer-events: none;
    }

    /* درخشش براق کوچک روی سنگ */
    .stone::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 8px;
      top: 9px;
      left: 12px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: rotate(-25deg);
      filter: blur(1px);
      pointer-events: none;
    }

    .stone:hover {
      transform: translateY(-4px) scale(1.08);
    }

    .stone:active {
      transform: translateY(2px) scale(0.95);
    }

    /* افکت درخشش شدید سنگ (Glow & Step) */
    .stone.active-glow {
      transform: translateY(-8px) scale(1.18) !important;
      border-color: rgba(255,255,255,0.9) !important;
      box-shadow:
        0 0 28px 4px var(--glow-color),
        inset 0 0 14px rgba(255,255,255,0.7) !important;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,0.8) 0%, transparent 35%),
        linear-gradient(155deg, var(--glow-color) 0%, var(--glow-color) 100%) !important;
    }

    /* موج بازتاب آب دور سنگ هنگام پا گذاشتن */
    .ripple {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      pointer-events: none;
      animation: rippleExpand 0.6s ease-out forwards;
      top: -3px;
      left: 0;
    }

    @keyframes rippleExpand {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* باکس پیام و راهنما */
    .info-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 5;
      min-height: 52px;
    }

    .status-msg {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f1f2f6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      text-align: center;
    }

    .sub-indicator {
      font-size: 0.9rem;
      color: #a4b0be;
      font-weight: 600;
    }

    /* لایه منو، شروع و پایان */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 28, 21, 0.92);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
      border-radius: 28px;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .btn-start {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: #0d211a;
      font-size: 1.25rem;
      font-weight: 900;
      border: none;
      padding: 14px 44px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 206, 201, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-start:hover {
      transform: scale(1.06);
      box-shadow: 0 14px 30px rgba(0, 206, 201, 0.6);
    }

    #confetti-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- بخش بالا: نوار وضعیت و پیشرفت -->
    <div style="width: 100%;">
      <div class="top-bar">
        <div class="badge">مرحله: <span id="level-num">۱</span></div>
        <div class="badge">امتیاز: <span id="score-num">۰</span></div>
        <div class="badge">فرصت: <span id="lives-num">❤️❤️❤️</span></div>
      </div>
      <div class="progress-wrapper">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- رودخانه و سنگ‌ها -->
    <div class="river-stage">
      <div class="water-wave"></div>
      <div class="stepping-stones-grid" id="stones-grid"></div>
    </div>

    <!-- راهنمای گام‌ها و نوبت -->
    <div class="info-footer">
      <div class="status-msg" id="status-text">توالی نورها را تماشا کنید...</div>
      <div class="sub-indicator" id="step-indicator"></div>
    </div>

    <!-- منوی شروع و نتیجه بازی -->
    <div class="overlay" id="menu-overlay">
      <h1 style="font-size: 2.2rem; color: #55efc4;">🌈 ردپای رنگین‌کمان</h1>
      <p style="max-width: 420px; line-height: 1.6; color: #dfe6e9; font-size: 1rem;">
        سنگ‌های رودخانه به ترتیب روشن می‌شوند. به ترتیب و رنگ آن‌ها دقت کنید و سپس با گام برداشتن روی سنگ‌ها همان مسیر را بازتولید کنید!
      </p>
      <button class="btn-start" id="start-btn">شروع ماجراجویی</button>
    </div>
  </div>

  <script>
    // پالت رنگ‌های نئونی سنگ‌ها و فرکانس‌های صوتی اختصاصی هر رنگ
    const STONES_DATA = [
      { id: 0, name: 'یاقوتی', color: '#ff4757', freq: 261.63 }, // C4
      { id: 1, name: 'نارنجی', color: '#ffa502', freq: 293.66 }, // D4
      { id: 2, name: 'زمردی', color: '#2ed573', freq: 329.63 }, // E4
      { id: 3, name: 'فیروزه‌ای', color: '#1e90ff', freq: 392.00 }, // G4
      { id: 4, name: 'بنفش', color: '#9b59b6', freq: 440.00 }, // A4
      { id: 5, name: 'صورتی', color: '#ff6b81', freq: 523.25 }, // C5
      { id: 6, name: 'لیمویی', color: '#eccc68', freq: 587.33 }, // D5
      { id: 7, name: 'آسمانی', color: '#70a1ff', freq: 659.25 }  // E5
    ];

    // سیستم صوتی Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, duration = 0.25, type = 'sine', gainVal = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundSplash() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function soundSuccess() {
      const arpeggio = [523.25, 659.25, 783.99, 1046.50];
      arpeggio.forEach((f, i) => {
        setTimeout(() => playTone(f, 0.2, 'triangle', 0.15), i * 75);
      });
    }

    function soundFail() {
      playTone(220, 0.25, 'sawtooth', 0.2);
      setTimeout(() => playTone(146, 0.35, 'sawtooth', 0.25), 140);
    }

    // متغیرهای وضعیت بازی
    let level = 1;
    let score = 0;
    let lives = 3;
    let sequence = [];
    let playerStep = 0;
    let isPlayerTurn = false;
    let activeStonesCount = 4;

    const stonesGrid = document.getElementById('stones-grid');
    const statusText = document.getElementById('status-text');
    const stepIndicator = document.getElementById('step-indicator');
    const progressBar = document.getElementById('progress-bar');
    const overlay = document.getElementById('menu-overlay');
    const startBtn = document.getElementById('start-btn');

    startBtn.onclick = () => {
      overlay.style.display = 'none';
      initGame();
    };

    function initGame() {
      level = 1;
      score = 0;
      lives = 3;
      updateStatusHeader();
      startLevel();
    }

    function updateStatusHeader() {
      document.getElementById('level-num').innerText = level;
      document.getElementById('score-num').innerText = score;
      document.getElementById('lives-num').innerText = '❤️'.repeat(lives);
      const progressPercent = Math.min(100, (level / 10) * 100);
      progressBar.style.width = `${progressPercent}%`;
    }

    function renderStones() {
      // تعداد سنگ‌ها: در مراحل اول ۴ سنگ، با بالاتر رفتن تا ۸ سنگ
      activeStonesCount = level >= 6 ? 8 : (level >= 3 ? 6 : 4);
      stonesGrid.innerHTML = '';

      for (let i = 0; i < activeStonesCount; i++) {
        const stoneData = STONES_DATA[i];
        const wrap = document.createElement('div');
        wrap.className = 'stone-wrap';

        const stone = document.createElement('div');
        stone.className = 'stone';
        stone.id = `stone-${i}`;
        stone.style.setProperty('--glow-color', stoneData.color);
        stone.onclick = () => handlePlayerStep(i);

        wrap.appendChild(stone);
        stonesGrid.appendChild(wrap);
      }
    }

    async function startLevel() {
      isPlayerTurn = false;
      playerStep = 0;
      renderStones();
      statusText.innerText = '👀 توالی رنگ‌ها را با دقت نگاه کنید...';
      stepIndicator.innerText = '';

      // طول توالی: در مراحل آسان ۳ رنگ، در مراحل بالاتر طولانی‌تر
      const sequenceLength = Math.min(7, 2 + Math.ceil(level / 2));
      sequence = [];
      for (let i = 0; i < sequenceLength; i++) {
        sequence.push(Math.floor(Math.random() * activeStonesCount));
      }

      await new Promise(r => setTimeout(r, 700));

      // نمایش توالی با انیمیشن و صدا
      const speed = Math.max(300, 700 - level * 40);
      for (let i = 0; i < sequence.length; i++) {
        await activateStoneGlow(sequence[i], speed * 0.7);
        await new Promise(r => setTimeout(r, speed * 0.3));
      }

      // شروع نوبت بازیکن
      isPlayerTurn = true;
      statusText.innerText = '👉 نوبت شماست! روی سنگ‌ها گام بردارید';
      updateStepIndicator();
    }

    function activateStoneGlow(stoneIndex, duration = 400) {
      return new Promise(resolve => {
        const stoneEl = document.getElementById(`stone-${stoneIndex}`);
        if (!stoneEl) return resolve();

        const stoneData = STONES_DATA[stoneIndex];
        playTone(stoneData.freq, duration / 1000, 'sine', 0.2);

        // تولید موج آب در اطراف سنگ
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        stoneEl.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);

        stoneEl.classList.add('active-glow');
        setTimeout(() => {
          stoneEl.classList.remove('active-glow');
          resolve();
        }, duration);
      });
    }

    function updateStepIndicator() {
      stepIndicator.innerText = `گام ${playerStep + 1} از ${sequence.length}`;
    }

    async function handlePlayerStep(stoneIndex) {
      if (!isPlayerTurn) return;

      // پخش انیمیشن و صدای لمس سنگ
      activateStoneGlow(stoneIndex, 250);

      // بررسی درستی گام
      if (stoneIndex === sequence[playerStep]) {
        playerStep++;
        if (playerStep === sequence.length) {
          // اتمام موفق مرحله
          isPlayerTurn = false;
          soundSuccess();
          score += 100 + (level * 30);
          statusText.innerText = '✨ عالی بود! مسیر رنگین‌کمان کامل شد.';
          stepIndicator.innerText = '';
          triggerConfetti();
          level++;
          updateStatusHeader();
          setTimeout(startLevel, 1700);
        } else {
          updateStepIndicator();
        }
      } else {
        // گام اشتباه و سقوط در آب
        isPlayerTurn = false;
        soundFail();
        soundSplash();
        lives--;
        statusText.innerText = '❌ لغزیدی! توالی اشتباه بود.';
        stepIndicator.innerText = '';
        updateStatusHeader();

        if (lives <= 0) {
          setTimeout(showGameOver, 1400);
        } else {
          setTimeout(startLevel, 1800);
        }
      }
    }

    function showGameOver() {
      overlay.style.display = 'flex';
      overlay.querySelector('h1').innerText = 'پایان بازی!';
      overlay.querySelector('p').innerText = `امتیاز شما: ${score} | به مرحله ${level} رسیدی.`;
      startBtn.innerText = 'شروع دوباره';
    }

    // ذرات آتش‌بازی و پیروزی (Confetti)
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const particles = Array.from({ length: 40 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2 + 40,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.7) * 11,
        size: Math.random() * 7 + 4,
        color: STONES_DATA[Math.floor(Math.random() * STONES_DATA.length)].color
      }));

      let frame = 0;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.26;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (++frame < 50) requestAnimationFrame(render);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      render();
    }
  </script>
</body>
</html>
