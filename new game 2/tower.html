<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معماری برج رویایی</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050814;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
        }

        #phase-banner {
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #00f2fe;
            z-index: 10;
            transition: all 0.3s ease;
        }

        #inventory-dock {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 14px;
            max-height: 74vh;
            overflow-y: auto;
            z-index: 10;
        }

        .part-card {
            width: 100px;
            padding: 8px 6px 10px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .part-card:hover {
            transform: scale(1.07) translateX(-4px);
            border-color: rgba(255,255,255,0.5);
        }

        .part-card svg {
            width: 46px;
            height: 46px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .part-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
            line-height: 1.3;
        }

        .part-color-label {
            font-size: 0.68rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
            padding: 1px 8px;
            border-radius: 999px;
            margin-top: 1px;
        }

        .part-rot-chip {
            position: absolute;
            top: -8px;
            left: -8px;
            background: rgba(5,8,20,0.9);
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 999px;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 6px;
            color: #ffe066;
            box-shadow: 0 0 8px rgba(255,224,102,0.4);
        }

        #action-dock {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .btn-action {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 10px;
            color: #040d1a;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 8px 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 242, 254, 0.3);
            transition: all 0.25s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.55);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.35);
        }

        .modal-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(12, 24, 48, 0.96) 0%, rgba(3, 7, 18, 0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 24px;
        }

        .modal-screen h1 {
            font-size: 3.2rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-screen p {
            max-width: 520px;
            font-size: 1.15rem;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud" class="glass-panel" style="display: none;">
        <div class="hud-item">مرحله: <span id="val-level">۱</span></div>
        <div class="hud-item">زمان: <span id="val-timer">--</span></div>
        <div class="hud-item">امتیاز: <span id="val-score">۰</span></div>
    </div>

    <div id="phase-banner" class="glass-panel" style="display: none;">الگو را دقیق به خاطر بسپارید</div>

    <div id="inventory-dock" class="glass-panel" style="display: none;"></div>

    <div id="action-dock" style="display: none;">
        <button id="btn-undo" class="btn-action btn-danger">حذف آخرین قطعه</button>
        <button id="btn-submit" class="btn-action">تأیید و بررسی سازه</button>
    </div>

    <div id="start-screen" class="modal-screen">
        <h1>معماری برج رویایی</h1>
        <p>یک چالش فضایی سخت برای تقویت هوش سه‌بعدی و حافظه فعال! سازه را پیش از ناپدید شدن بررسی و سپس با قطعات سمت راست به دقت بازسازی کنید. هر آیکون دقیقاً شکل و رنگ واقعی قطعه را نشان می‌دهد.</p>
        <button id="btn-start" class="btn-action" style="font-size: 1.25rem; padding: 16px 48px; border-radius: 40px;">شروع بازی</button>
    </div>

    <div id="result-screen" class="modal-screen" style="display: none;">
        <h1 id="result-title">نتیجه</h1>
        <p id="result-desc"></p>
        <button id="btn-next" class="btn-action" style="font-size: 1.2rem; padding: 16px 44px; border-radius: 40px;">ادامه چالش</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        class AudioSynth {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.25) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            click() { this.playTone(600, 'triangle', 0.08, 0.2); }
            drop() { this.playTone(320, 'sine', 0.25, 0.4); }
            success() {
                [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.playTone(f, 'triangle', 0.35, 0.3), i * 110));
            }
            fail() {
                [280, 220, 160].forEach((f, i) => setTimeout(() => this.playTone(f, 'sawtooth', 0.35, 0.3), i * 140));
            }
        }

        const sfx = new AudioSynth();

        const PART_TYPES = [
            { type: 'cube', name: 'مکعب', create: () => new THREE.BoxGeometry(1.6, 1.2, 1.6) },
            { type: 'cylinder', name: 'استوانه', create: () => new THREE.CylinderGeometry(0.85, 0.85, 1.3, 32) },
            { type: 'cone', name: 'مخروط', create: () => new THREE.ConeGeometry(0.95, 1.5, 32) },
            { type: 'hex', name: 'منشور ۶ وجهی', create: () => new THREE.CylinderGeometry(0.9, 0.9, 1.2, 6) }
        ];

        // All 8 colors share the exact same saturation (78%) and lightness
        // (54%) — only the hue changes — so none looks pale/washed-out and
        // none looks dark/oversaturated next to the others. This is the
        // single palette used for both the dock icons and the tower blocks,
        // so a child always compares like-for-like.
        const PALETTE = [
            0xe52e2e, // قرمز
            0xe58a2e, // نارنجی
            0xe5c72e, // زرد
            0x2ee56b, // سبز
            0x2ec7e5, // فیروزه‌ای
            0x2e5ce5, // آبی
            0x992ee5, // بنفش
            0xe52ea8  // صورتی
        ];
        const COLOR_NAMES = {
            0xe52e2e: 'قرمز',
            0xe58a2e: 'نارنجی',
            0xe5c72e: 'زرد',
            0x2ee56b: 'سبز',
            0x2ec7e5: 'فیروزه‌ای',
            0x2e5ce5: 'آبی',
            0x992ee5: 'بنفش',
            0xe52ea8: 'صورتی'
        };
        // Readable text color placed on top of each swatch background
        const COLOR_TEXT = {
            0xe52e2e: '#ffffff',
            0xe58a2e: '#ffffff',
            0xe5c72e: '#3a2c00',
            0x2ee56b: '#052a13',
            0x2ec7e5: '#00303a',
            0x2e5ce5: '#ffffff',
            0x992ee5: '#ffffff',
            0xe52ea8: '#ffffff'
        };

        function shapeIconSVG(shapeKey, hex) {
            switch (shapeKey) {
                case 'cube':
                    return `<svg viewBox="0 0 40 40">
                        <polygon points="20,3 35,11 20,19 5,11" fill="${hex}"/>
                        <polygon points="5,11 20,19 20,36 5,28" fill="${hex}" opacity="0.55"/>
                        <polygon points="35,11 20,19 20,36 35,28" fill="${hex}" opacity="0.82"/>
                    </svg>`;
                case 'cylinder':
                    return `<svg viewBox="0 0 40 40">
                        <ellipse cx="20" cy="29" rx="14" ry="6" fill="${hex}" opacity="0.85"/>
                        <rect x="6" y="10" width="28" height="19" fill="${hex}" opacity="0.7"/>
                        <ellipse cx="20" cy="10" rx="14" ry="6" fill="${hex}"/>
                        <ellipse cx="20" cy="10" rx="14" ry="6" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
                    </svg>`;
                case 'cone':
                    return `<svg viewBox="0 0 40 40">
                        <ellipse cx="20" cy="31" rx="14" ry="6" fill="${hex}" opacity="0.85"/>
                        <polygon points="20,3 34,31 6,31" fill="${hex}"/>
                    </svg>`;
                case 'hex':
                    return `<svg viewBox="0 0 40 40">
                        <polygon points="20,3 35,11 35,27 20,35 5,27 5,11" fill="${hex}"/>
                        <polygon points="20,3 35,11 20,19 5,11" fill="${hex}" opacity="0.6"/>
                    </svg>`;
                default:
                    return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="${hex}"/></svg>`;
            }
        }
        function colorToRGBA(intColor, a) {
            const r = (intColor >> 16) & 255, g = (intColor >> 8) & 255, b = intColor & 255;
            return `rgba(${r},${g},${b},${a})`;
        }
        function colorToHexStr(intColor) {
            return '#' + intColor.toString(16).padStart(6, '0');
        }

        let level = 1;
        let score = 0;
        let targetTower = [];
        let playerTower = [];
        let availableParts = [];
        let phase = 'idle';
        let timerInterval = null;
        let timeLeft = 0;
        const clock = new THREE.Clock();

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050814, 0.028);

        (function buildSky() {
            const c = document.createElement('canvas');
            c.width = 2; c.height = 256;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#0b1230');
            grad.addColorStop(0.5, '#0a0f24');
            grad.addColorStop(1, '#020308');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 2, 256);
            const tex = new THREE.CanvasTexture(c);
            scene.background = tex;
        })();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4.5, 9.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.NoToneMapping;
        renderer.toneMappingExposure = 1.0;
        if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 14;
        controls.target.set(0, 1.5, 0);

        const hemiLight = new THREE.HemisphereLight(0x8fd8ff, 0x0a0a18, 0.75);
        scene.add(hemiLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(6, 14, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00f2fe, 0.6, 20);
        pointLight.position.set(-4, 4, -3);
        scene.add(pointLight);

        const rimLight = new THREE.PointLight(0xff007f, 0.4, 22);
        rimLight.position.set(5, 3, -5);
        scene.add(rimLight);

        (function buildStars() {
            const starCount = 600;
            const positions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const r = 30 + Math.random() * 40;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 0.6 + 0.05;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi) * 0.6 + 4;
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0xbfe8ff, size: 0.12, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(geo, mat);
            scene.add(stars);
        })();

        const dustCount = 90;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        const dustSpeeds = [];
        for (let i = 0; i < dustCount; i++) {
            const ang = Math.random() * Math.PI * 2;
            const rad = 1.5 + Math.random() * 3.5;
            dustPositions[i * 3] = Math.cos(ang) * rad;
            dustPositions[i * 3 + 1] = Math.random() * 6;
            dustPositions[i * 3 + 2] = Math.sin(ang) * rad;
            dustSpeeds.push(0.2 + Math.random() * 0.4);
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0x8fd8ff, size: 0.06, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending });
        const dustPoints = new THREE.Points(dustGeo, dustMat);
        scene.add(dustPoints);

        const pedestal = new THREE.Mesh(
            new THREE.CylinderGeometry(2.6, 2.9, 0.6, 64),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.85, roughness: 0.18 })
        );
        pedestal.position.y = -0.3;
        pedestal.receiveShadow = true;
        scene.add(pedestal);

        const gridRing = new THREE.Mesh(
            new THREE.RingGeometry(2.62, 2.72, 64),
            new THREE.MeshBasicMaterial({ color: 0x00f2fe, side: THREE.DoubleSide, transparent: true })
        );
        gridRing.rotation.x = Math.PI / 2;
        gridRing.position.y = 0.01;
        scene.add(gridRing);

        const outerRing = new THREE.Mesh(
            new THREE.RingGeometry(3.0, 3.06, 64),
            new THREE.MeshBasicMaterial({ color: 0xff007f, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
        );
        outerRing.rotation.x = Math.PI / 2;
        outerRing.position.y = 0.01;
        scene.add(outerRing);

        const towerGroup = new THREE.Group();
        scene.add(towerGroup);

        const SHAPE_HEIGHTS = { cube: 1.2, cylinder: 1.3, cone: 1.5, hex: 1.2 };
        function calcTowerHeight(towerArray) {
            return towerArray.reduce((acc, p) => acc + (SHAPE_HEIGHTS[p.shapeKey] || 1.3), 0);
        }
        function adjustCameraForHeight(rawHeight) {
            const h = Math.max(rawHeight, 3) * 1.15;
            const dist = 8 + h * 0.85;
            const camY = 2.4 + h * 0.55;
            camera.position.set(0, camY, dist);
            controls.target.set(0, h / 2, 0);
            controls.minDistance = Math.max(5, dist - 5);
            controls.maxDistance = dist + 10;
            camera.updateProjectionMatrix();
        }

        function generateLevelConfig(lvl) {
            let count, memorizationTime, buildTime, decoyCount;

            if (lvl < 4) {
                count = Math.min(3 + Math.floor((lvl - 1) / 2), 7);
                memorizationTime = Math.max(8 - Math.floor(lvl / 3), 3);
                buildTime = Math.max(30 - (lvl * 2), 12);
                decoyCount = 3;
            } else {
                count = Math.min(5 + (lvl - 4), 10);
                memorizationTime = Math.max(6 - (lvl - 4), 3);
                buildTime = Math.max(20 - (lvl - 4) * 3, 9);
                decoyCount = Math.min(4 + (lvl - 4), 8);
            }

            const tower = [];
            for (let i = 0; i < count; i++) {
                const shape = PART_TYPES[Math.floor(Math.random() * PART_TYPES.length)];
                const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
                const rotY = (Math.floor(Math.random() * 4) * Math.PI) / 4;
                tower.push({ shapeKey: shape.type, color, rotY });
            }
            return { tower, memorizationTime, buildTime, decoyCount };
        }

        function createMesh(data) {
            const shapeObj = PART_TYPES.find(p => p.type === data.shapeKey);
            const geo = shapeObj.create();
            const mat = new THREE.MeshPhysicalMaterial({
                color: data.color,
                roughness: 0.55,
                metalness: 0,
                clearcoat: 0.12,
                clearcoatRoughness: 0.55,
                // High emissive at this color makes the block read as its
                // true flat hue (matching the dock swatch 1:1) instead of a
                // lit/shaded version that can look like a different color to
                // a child, especially under the scene's colored lights.
                emissive: new THREE.Color(data.color),
                emissiveIntensity: 0.85
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.rotation.y = data.rotY;
            return mesh;
        }

        function renderTower(towerArray, animated = false) {
            while (towerGroup.children.length > 0) {
                towerGroup.remove(towerGroup.children[0]);
            }

            let currentY = 0;
            towerArray.forEach((part, index) => {
                const mesh = createMesh(part);
                mesh.geometry.computeBoundingBox();
                const height = mesh.geometry.boundingBox.max.y - mesh.geometry.boundingBox.min.y;
                const posY = currentY + height / 2;
                currentY += height;

                mesh.position.y = animated ? posY + 6 : posY;
                towerGroup.add(mesh);

                if (animated) {
                    let start = null;
                    function dropAnim(time) {
                        if (!start) start = time;
                        let progress = (time - start) / 380;
                        if (progress > 1) progress = 1;
                        mesh.position.y = THREE.MathUtils.lerp(posY + 6, posY, 1 - Math.pow(1 - progress, 3));
                        if (progress < 1) requestAnimationFrame(dropAnim);
                    }
                    setTimeout(() => requestAnimationFrame(dropAnim), index * 90);
                }
            });
        }

        function startLevel() {
            phase = 'memorize';
            playerTower = [];
            const config = generateLevelConfig(level);
            targetTower = config.tower;
            adjustCameraForHeight(calcTowerHeight(targetTower));

            document.getElementById('val-level').innerText = level;
            document.getElementById('val-score').innerText = score;
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('phase-banner').style.display = 'block';
            document.getElementById('phase-banner').innerText = 'الگو را دقیق به خاطر بسپارید';
            document.getElementById('action-dock').style.display = 'none';
            document.getElementById('inventory-dock').style.display = 'none';

            renderTower(targetTower, true);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 4;

            timeLeft = config.memorizationTime;
            document.getElementById('val-timer').innerText = timeLeft + 's';

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('val-timer').innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    enterBuildingPhase(config);
                }
            }, 1000);
        }

        function enterBuildingPhase(config) {
            phase = 'build';
            controls.autoRotate = false;
            while (towerGroup.children.length > 0) towerGroup.remove(towerGroup.children[0]);

            document.getElementById('phase-banner').innerText = 'برج را از پایه بازسازی کنید';
            document.getElementById('action-dock').style.display = 'flex';
            document.getElementById('inventory-dock').style.display = 'flex';

            const pool = [...targetTower];
            while (pool.length < targetTower.length + config.decoyCount) {
                pool.push({
                    shapeKey: PART_TYPES[Math.floor(Math.random() * PART_TYPES.length)].type,
                    color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
                    rotY: 0
                });
            }
            availableParts = pool.sort(() => Math.random() - 0.5);
            renderDock();

            timeLeft = config.buildTime;
            document.getElementById('val-timer').innerText = timeLeft + 's';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('val-timer').innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkSolution();
                }
            }, 1000);
        }

        function renderDock() {
            const dock = document.getElementById('inventory-dock');
            dock.innerHTML = '';

            availableParts.forEach((part) => {
                const shapeInfo = PART_TYPES.find(p => p.type === part.shapeKey);
                const hexColor = colorToHexStr(part.color);

                const card = document.createElement('div');
                card.className = 'part-card';
                card.style.borderColor = colorToRGBA(part.color, 0.7);
                card.style.background = `linear-gradient(180deg, ${colorToRGBA(part.color, 0.16)}, rgba(255,255,255,0.05))`;
                card.style.boxShadow = `0 0 16px ${colorToRGBA(part.color, 0.45)}, inset 0 0 12px ${colorToRGBA(part.color, 0.12)}`;

                const iconWrap = document.createElement('div');
                iconWrap.innerHTML = shapeIconSVG(part.shapeKey, hexColor);
                card.appendChild(iconWrap.firstElementChild);

                const label = document.createElement('div');
                label.className = 'part-label';
                label.textContent = shapeInfo.name;
                card.appendChild(label);

                // Explicit color-name chip so parts never rely on hue alone.
                const colorLabel = document.createElement('div');
                colorLabel.className = 'part-color-label';
                colorLabel.textContent = COLOR_NAMES[part.color] || '';
                colorLabel.style.background = hexColor;
                colorLabel.style.color = COLOR_TEXT[part.color] || '#000';
                card.appendChild(colorLabel);

                const rotDeg = Math.round((part.rotY * 180) / Math.PI);
                if (rotDeg !== 0) {
                    const chip = document.createElement('div');
                    chip.className = 'part-rot-chip';
                    chip.textContent = '↻' + rotDeg + '°';
                    card.appendChild(chip);
                }

                card.onclick = () => {
                    if (phase !== 'build') return;
                    sfx.drop();
                    playerTower.push(part);
                    renderTower(playerTower, false);
                };
                dock.appendChild(card);
            });
        }

        document.getElementById('btn-undo').onclick = () => {
            if (playerTower.length > 0) {
                sfx.click();
                playerTower.pop();
                renderTower(playerTower, false);
            }
        };

        function checkSolution() {
            clearInterval(timerInterval);
            phase = 'result';

            let isCorrect = (playerTower.length === targetTower.length);
            if (isCorrect) {
                for (let i = 0; i < targetTower.length; i++) {
                    if (playerTower[i].shapeKey !== targetTower[i].shapeKey || 
                        playerTower[i].color !== targetTower[i].color) {
                        isCorrect = false;
                        break;
                    }
                }
            }

            const modal = document.getElementById('result-screen');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');

            modal.style.display = 'flex';

            if (isCorrect) {
                sfx.success();
                score += level * 100 + timeLeft * 10;
                title.innerText = '✨ سازه بی‌نقص!';
                desc.innerText = `عالی بود! برج به درستی ساخته شد.\nامتیاز کل: ${score}`;
                document.getElementById('btn-next').innerText = 'مرحله بعدی';
                document.getElementById('btn-next').onclick = () => {
                    level++;
                    modal.style.display = 'none';
                    startLevel();
                };
            } else {
                sfx.fail();
                title.innerText = '❌ سازه ناپایدار!';
                desc.innerText = 'ترکیب یا ترتیب قطعات با الگوی اصلی یکسان نبود.';
                document.getElementById('btn-next').innerText = 'تلاش مجدد';
                document.getElementById('btn-next').onclick = () => {
                    modal.style.display = 'none';
                    startLevel();
                };
            }
        }

        document.getElementById('btn-submit').onclick = () => {
            sfx.click();
            checkSolution();
        };

        document.getElementById('btn-start').onclick = () => {
            sfx.click();
            document.getElementById('start-screen').style.display = 'none';
            startLevel();
        };

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            controls.update();

            const pulse = 1 + Math.sin(t * 1.6) * 0.05;
            gridRing.scale.set(pulse, pulse, 1);
            gridRing.material.opacity = 0.6 + Math.sin(t * 1.6) * 0.25;
            outerRing.material.opacity = 0.3 + Math.sin(t * 1.2 + 1) * 0.15;
            pointLight.intensity = 0.6 + Math.sin(t * 2) * 0.15;

            const posAttr = dustGeo.attributes.position;
            for (let i = 0; i < dustCount; i++) {
                let y = posAttr.getY(i) + dustSpeeds[i] * 0.01;
                if (y > 6.5) y = 0;
                posAttr.setY(i, y);
            }
            posAttr.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
