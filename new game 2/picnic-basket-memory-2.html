<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد پیک‌نیک | بازی حافظه ترتیبی</title>
  <style>
    :root {
      --grass-top: #a8e063;
      --grass-bot: #56ab2f;
      --basket-main: #8d5b2c;
      --basket-pattern: #6f421b;
      --basket-rim: #543112;
      --cloth: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, var(--grass-top) 0%, var(--grass-bot) 100%);
      overflow: hidden;
    }

    /* سفره پیک‌نیک شطرنجی پس‌زمینه */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(45deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%), 
        linear-gradient(-45deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.08) 75%);
      background-size: 60px 60px;
      pointer-events: none;
    }

    #game-container {
      position: relative;
      width: 900px;
      max-width: 95vw;
      height: 620px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(14px);
      border-radius: 32px;
      border: 3px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
      overflow: hidden;
      perspective: 1200px;
    }

    /* نوار بالایی وضعیت */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      color: #1e392a;
      font-size: 1.15rem;
      z-index: 5;
    }

    .badge {
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* صحنه قرارگیری سبد و انیمیشن پرتاب */
    .picnic-stage {
      position: relative;
      width: 100%;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 60px;
    }

    /* سفره زیر سبد */
    .picnic-blanket {
      position: absolute;
      bottom: 0;
      width: 440px;
      height: 110px;
      background: repeating-linear-gradient(45deg, #fff, #fff 15px, #ff4757 15px, #ff4757 30px);
      border-radius: 50%;
      transform: rotateX(60deg);
      box-shadow: 0 20px 25px rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* سبد حصیری با جزئیات سه‌بعدی */
    .basket-wrapper {
      position: relative;
      width: 260px;
      height: 180px;
      z-index: 3;
    }

    .basket-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 130px;
      background: repeating-linear-gradient(
        45deg,
        var(--basket-main),
        var(--basket-main) 12px,
        var(--basket-pattern) 12px,
        var(--basket-pattern) 24px
      );
      border: 5px solid var(--basket-rim);
      border-radius: 12px 12px 45px 45px;
      box-shadow: inset 0 -15px 25px rgba(0,0,0,0.5), 0 15px 25px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .basket-handle {
      position: absolute;
      top: -45px;
      left: 30px;
      width: 200px;
      height: 110px;
      border: 12px solid var(--basket-rim);
      border-bottom: none;
      border-radius: 100px 100px 0 0;
      z-index: 2;
    }

    /* درهای بازشونده با پرسپکتیو دوطرفه */
    .lid-container {
      position: absolute;
      top: 50px;
      width: 100%;
      height: 24px;
      display: flex;
      justify-content: space-between;
      z-index: 4;
      perspective: 800px;
    }

    .lid-half {
      width: 49%;
      height: 22px;
      background: var(--basket-rim);
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .lid-left {
      transform-origin: left center;
    }

    .lid-right {
      transform-origin: right center;
    }

    .lid-left.open { transform: rotateY(-115deg) translateY(-10px); }
    .lid-right.open { transform: rotateY(115deg) translateY(-10px); }

    /* لنگر ثابت: دقیقاً روی دهانه سبد قرار می‌گیرد، بدون افتادن به بیرون کادر */
    .food-anchor {
      position: absolute;
      left: 50%;
      top: 155px;
      transform: translate(-50%, -50%);
      z-index: 6;
      pointer-events: none;
    }

    /* آیتم متحرک خوراکی (داخل لنگر) */
    .food-item {
      font-size: 2.3rem;
      pointer-events: none;
      filter: drop-shadow(0 12px 14px rgba(0,0,0,0.35)) drop-shadow(0 0 18px rgba(255,255,255,0.5));
      will-change: transform, opacity, filter;
    }

    /* انیمیشن پیشرفته پرتاب: کمان طبیعی، درخشش هنگام اوج، له‌شدگی نرم هنگام فرود در سبد */
    @keyframes dropIntoBasket {
      0% {
        transform: translate(var(--start-x), 10px) scale(0.2) rotate(0deg);
        opacity: 0;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)) drop-shadow(0 0 0px rgba(255,255,255,0));
      }
      12% {
        transform: translate(calc(var(--start-x) * 0.85), -40px) scale(1.05) rotate(var(--spin-1));
        opacity: 1;
      }
      38% {
        transform: translate(var(--mid-x), -140px) scale(1.2) rotate(var(--spin-2));
        filter: drop-shadow(0 20px 18px rgba(0,0,0,0.3)) drop-shadow(0 0 30px rgba(255,255,255,0.85));
      }
      58% {
        transform: translate(calc(var(--mid-x) * 0.35), -45px) scale(1.05) rotate(var(--spin-3));
        filter: drop-shadow(0 14px 14px rgba(0,0,0,0.3)) drop-shadow(0 0 14px rgba(255,255,255,0.5));
      }
      72% {
        transform: translate(0px, 14px) scale(0.8, 1.1) rotate(0deg);
      }
      80% {
        transform: translate(0px, 4px) scale(1.05, 0.7) rotate(0deg);
        opacity: 1;
      }
      88% {
        transform: translate(0px, 12px) scale(0.85, 1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(0px, 34px) scale(0.3, 0.3) rotate(0deg);
        opacity: 0;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)) drop-shadow(0 0 0px rgba(255,255,255,0));
      }
    }

    /* بخش پرسش و گزینه‌های انتخابی */
    .action-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 120px;
      z-index: 5;
    }

    .question-box {
      font-size: 1rem;
      font-weight: 800;
      color: #1b3824;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      text-align: center;
    }

    .options-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .choice-card {
      background: white;
      border: 3px solid #dfe6e9;
      border-radius: 20px;
      width: 75px;
      height: 75px;
      font-size: 2.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .choice-card:hover {
      transform: translateY(-8px) scale(1.1);
      border-color: #2ed573;
      box-shadow: 0 14px 24px rgba(46, 213, 115, 0.35);
    }

    .choice-card:active {
      transform: scale(0.95);
    }

    /* صفحه خوش‌آمدگویی و باخت */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(24, 44, 30, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 20;
      border-radius: 32px;
      color: white;
      text-align: center;
      padding: 30px;
    }

    .btn-start {
      background: linear-gradient(135deg, #2ed573, #10ac84);
      color: white;
      font-size: 1.35rem;
      font-weight: 800;
      border: none;
      padding: 16px 48px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(46, 213, 115, 0.45);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-start:hover {
      transform: scale(1.06);
      box-shadow: 0 15px 35px rgba(46, 213, 115, 0.6);
    }

    #confetti-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- نوار وضعیت -->
    <div class="status-bar">
      <div class="badge">مرحله: <span id="level-num">۱</span></div>
      <div class="badge">امتیاز: <span id="score-num">۰</span></div>
      <div class="badge">فرصت: <span id="lives-num">❤️❤️❤️</span></div>
    </div>

    <!-- استیج سبد -->
    <div class="picnic-stage">
      <div class="picnic-blanket"></div>
      
      <div class="basket-wrapper" id="basket-wrapper">
        <div class="basket-handle"></div>
        <div class="lid-container">
          <div class="lid-half lid-left open" id="lid-l"></div>
          <div class="lid-half lid-right open" id="lid-r"></div>
        </div>
        <div class="basket-body"></div>
      </div>
    </div>

    <!-- پنل گزینه‌ها و پرسش -->
    <div class="action-panel">
      <div class="question-box" id="question-text">دقت کنید چه خوراکی‌هایی وارد سبد می‌شوند...</div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- منوی ورود / پایان -->
    <div class="overlay" id="menu-overlay">
      <h1 style="font-size: 2.6rem;">🧺 سبد پیک‌نیک</h1>
      <p style="max-width: 440px; line-height: 1.7; color: #dcdde1; font-size: 1.05rem;">
        ترتیب خوراکی‌هایی که وارد سبد می‌شوند را با دقت تماشا کنید. پس از بسته شدن سبد، باید خوراکی مشخص‌شده (اول، دوم، سوم و ...) را به یاد بیاورید!
      </p>
      <button class="btn-start" id="start-game-btn">شروع بازی</button>
    </div>
  </div>

  <script>
    // بانک خوراکی‌های متنوع
    const FOOD_ITEMS = [
      { id: 'apple', icon: '🍎', name: 'سیب' },
      { id: 'sandwich', icon: '🥪', name: 'ساندویچ' },
      { id: 'juice', icon: '🧃', name: 'آبمیوه' },
      { id: 'banana', icon: '🍌', name: 'موز' },
      { id: 'cookie', icon: '🍪', name: 'کوکی' },
      { id: 'watermelon', icon: '🍉', name: 'هندوانه' },
      { id: 'pizza', icon: '🍕', name: 'پیتزا' },
      { id: 'strawberry', icon: '🍓', name: 'توت‌فرنگی' },
      { id: 'croissant', icon: '🥐', name: 'کرواسان' },
      { id: 'cheese', icon: '🧀', name: 'پنیر' }
    ];

    const ORDINAL_NAMES = {
      0: 'اول',
      1: 'دوم',
      2: 'سوم',
      3: 'چهارم',
      4: 'پنجم'
    };

    // موتور صوتی سنتزی
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, dur, gainVal = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function soundItemDrop() {
      // افکت جهش فرکانسی صعودی و سقوطی (Woosh & Plop)
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(580, audioCtx.currentTime + 0.15);
      osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    }

    function soundLidClose() {
      playTone(130, 'triangle', 0.25, 0.25);
      setTimeout(() => playTone(90, 'sawtooth', 0.2, 0.2), 60);
    }

    function soundCorrect() {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // آکورد دو ماژور
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'triangle', 0.25, 0.15), idx * 90);
      });
    }

    function soundWrong() {
      playTone(220, 'sawtooth', 0.2, 0.25);
      setTimeout(() => playTone(155, 'sawtooth', 0.35, 0.3), 140);
    }

    // متغیرهای وضعیت
    let level = 1;
    let score = 0;
    let lives = 3;
    let sequence = [];
    let targetIndex = 2; // در مراحل اولیه خوراکی سوم مد نظر است
    let isAcceptingInput = false;

    // المان‌های DOM
    const lidLeft = document.getElementById('lid-l');
    const lidRight = document.getElementById('lid-r');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const stage = document.querySelector('.picnic-stage');
    const overlay = document.getElementById('menu-overlay');
    const startBtn = document.getElementById('start-game-btn');

    startBtn.onclick = () => {
      overlay.style.display = 'none';
      initGame();
    };

    function initGame() {
      level = 1;
      score = 0;
      lives = 3;
      updateHeader();
      startRound();
    }

    function updateHeader() {
      document.getElementById('level-num').innerText = level;
      document.getElementById('score-num').innerText = score;
      document.getElementById('lives-num').innerText = '❤️'.repeat(lives);
    }

    function setLidsOpen(open) {
      if (open) {
        lidLeft.classList.add('open');
        lidRight.classList.add('open');
      } else {
        lidLeft.classList.remove('open');
        lidRight.classList.remove('open');
        soundLidClose();
      }
    }

    async function startRound() {
      isAcceptingInput = false;
      optionsContainer.innerHTML = '';
      questionText.innerText = 'دقت کنید خوراکی‌ها یکی‌یکی وارد سبد می‌شوند...';
      setLidsOpen(true);

      // تعیین تعداد آیتم‌ها بر اساس درجه سختی
      let itemCount = 3;
      if (level >= 6) itemCount = 5;
      else if (level >= 3) itemCount = 4;

      // انتخاب تصادفی آیتم‌ها بدون تکرار مستقیم
      const shuffled = [...FOOD_ITEMS].sort(() => 0.5 - Math.random());
      sequence = shuffled.slice(0, itemCount);

      // در مرحله ۱ و ۲ دقیقاً هدف «خوراکی سوم» است، در مراحل بعدی سوال متغیر می‌شود
      if (level <= 2) {
        targetIndex = 2; // خوراکی سوم
      } else {
        targetIndex = Math.floor(Math.random() * itemCount);
      }

      await new Promise(r => setTimeout(r, 600));

      // اجرای انیمیشن پرتاب خوراکی‌ها به ترتیب
      for (let i = 0; i < sequence.length; i++) {
        await animateItemIntoBasket(sequence[i], i);
        await new Promise(r => setTimeout(r, 450));
      }

      // بستن در سبد
      setLidsOpen(false);
      questionText.innerText = 'درِ سبد بسته شد!';

      await new Promise(r => setTimeout(r, 700));
      askQuestion();
    }

    function animateItemIntoBasket(item, index) {
      return new Promise(resolve => {
        const anchor = document.createElement('div');
        anchor.className = 'food-anchor';

        const foodEl = document.createElement('div');
        foodEl.className = 'food-item';
        foodEl.innerText = item.icon;

        // جهت پرتاب متناوب (چپ یا راست) + چرخش‌های تصادفی برای حس پویاتر
        const dir = index % 2 === 0 ? -1 : 1;
        foodEl.style.setProperty('--start-x', (dir * 150) + 'px');
        foodEl.style.setProperty('--mid-x', (dir * 45) + 'px');
        foodEl.style.setProperty('--spin-1', (dir * (120 + Math.random() * 60)) + 'deg');
        foodEl.style.setProperty('--spin-2', (dir * (260 + Math.random() * 80)) + 'deg');
        foodEl.style.setProperty('--spin-3', (dir * (340 + Math.random() * 40)) + 'deg');

        foodEl.style.animation = 'dropIntoBasket 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards';
        anchor.appendChild(foodEl);
        stage.appendChild(anchor);

        soundItemDrop();

        setTimeout(() => {
          anchor.remove();
          resolve();
        }, 1150);
      });
    }

    function askQuestion() {
      const ordinal = ORDINAL_NAMES[targetIndex] || `شماره ${targetIndex + 1}`;
      questionText.innerText = `خوراکی «${ordinal}» که داخل سبد گذاشته شد، کدام بود؟`;

      // ساخت گزینه‌ها (آیتم‌های داخل سبد + چند گزینه انحرافی تصادفی)
      const options = [...sequence];
      const distractors = FOOD_ITEMS.filter(f => !sequence.some(s => s.id === f.id));
      while (options.length < Math.min(6, sequence.length + 2)) {
        const rand = distractors.splice(Math.floor(Math.random() * distractors.length), 1)[0];
        if (rand) options.push(rand);
      }

      // مخلوط کردن چیدمان دکمه‌ها
      options.sort(() => 0.5 - Math.random());

      optionsContainer.innerHTML = '';
      options.forEach(item => {
        const card = document.createElement('button');
        card.className = 'choice-card';
        card.innerText = item.icon;
        card.onclick = () => handleChoice(item);
        optionsContainer.appendChild(card);
      });

      isAcceptingInput = true;
    }

    function handleChoice(selected) {
      if (!isAcceptingInput) return;
      isAcceptingInput = false;

      const correctItem = sequence[targetIndex];
      setLidsOpen(true);

      if (selected.id === correctItem.id) {
        soundCorrect();
        score += 150 + (level * 25);
        questionText.innerText = `✨ آفرین! خوراکی ${ORDINAL_NAMES[targetIndex]} همان ${correctItem.name} ${correctItem.icon} بود.`;
        triggerConfetti();
        level++;
        updateHeader();
        setTimeout(startRound, 2000);
      } else {
        soundWrong();
        lives--;
        questionText.innerText = `❌ اشتباه بود! خوراکی ${ORDINAL_NAMES[targetIndex]}، ${correctItem.name} ${correctItem.icon} بود.`;
        updateHeader();

        if (lives <= 0) {
          setTimeout(gameOver, 1600);
        } else {
          setTimeout(startRound, 2200);
        }
      }
    }

    function gameOver() {
      overlay.style.display = 'flex';
      overlay.querySelector('h1').innerText = 'بازی به پایان رسید!';
      overlay.querySelector('p').innerText = `امتیاز نهایی شما: ${score} | بالاترین مرحله: ${level}`;
      startBtn.innerText = 'تلاش مجدد';
    }

    // افکت ذرات جشن (Confetti)
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const particles = Array.from({ length: 50 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2 + 50,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 0.7) * 12,
        size: Math.random() * 8 + 4,
        color: ['#ff4757', '#2ed573', '#ffa502', '#1e90ff', '#ffffff'][Math.floor(Math.random() * 5)]
      }));

      let frame = 0;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.3; // جاذبه
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (++frame < 55) requestAnimationFrame(render);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      render();
    }
  </script>
</body>
</html>
