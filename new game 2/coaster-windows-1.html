<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنجره‌های قطار شهربازی | Coaster Windows</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sky: #1a1c38;
      --track-color: #636e72;
      --accent: #fdcb6e;
      --gold: #f39c12;
      --success: #2ecc71;
      --danger: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #2c3e50, #0a0b10);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game-container {
      width: 95vw;
      max-width: 980px;
      height: 90vh;
      max-height: 640px;
      background: linear-gradient(to bottom, #1d1b38 0%, #2f3542 70%, #57606f 100%);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 4px solid #3d4556;
    }

    /* Amusement Park Background & Lights */
    .bg-park {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .ferris-wheel {
      position: absolute;
      right: 30px;
      top: 40px;
      width: 140px;
      height: 140px;
      border: 3px dashed rgba(253, 203, 110, 0.4);
      border-radius: 50%;
      animation: spin 30s linear infinite;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 60%;
      background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 150px 80px, #ddd, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 240px 50px, #fffa65, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 250px 150px;
      opacity: 0.8;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Header / Score Board */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,255,255,0.08);
      color: #fff;
    }

    .hud-card {
      font-size: 1.1rem;
      font-weight: 700;
      background: rgba(255,255,255,0.1);
      padding: 6px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* Game Playfield */
    .viewport {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .question-banner {
      min-height: 48px;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 3px 6px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      transition: all 0.3s ease;
      text-align: center;
    }

    /* 3D Train & Track */
    .track-wrapper {
      width: 100%;
      height: 190px;
      position: relative;
      overflow: visible;
    }

    .rail-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .rail-path-bg {
      fill: none;
      stroke: #2d3436;
      stroke-width: 12;
      stroke-linecap: round;
    }

    .rail-path-fg {
      fill: none;
      stroke: #636e72;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 14 12;
    }

    .train-container {
      position: absolute;
      inset: 0;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5;
    }

    .locomotive {
      width: 46px;
      height: 74px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border-radius: 14px 3px 8px 8px;
      box-shadow: -3px 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4);
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chimney {
      width: 11px;
      height: 15px;
      background: #2c3e50;
      position: absolute;
      top: -10px;
      left: 9px;
      border-radius: 3px 3px 0 0;
    }

    .carriage {
      width: 58px;
      height: 74px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      border-radius: 10px;
      box-shadow: -3px 5px 11px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.3);
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
      transition: filter 0.2s;
    }

    .carriage.clickable {
      cursor: pointer;
    }

    .carriage.clickable:hover {
      filter: brightness(1.25);
    }

    .carriage-wheels {
      position: absolute;
      bottom: -10px;
      width: 85%;
      display: flex;
      justify-content: space-between;
    }

    .wheel {
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #7f8c8d 35%, #2c3e50 36%);
      border-radius: 50%;
      border: 1.5px solid #bdc3c7;
      box-shadow: 0 3px 4px rgba(0,0,0,0.5);
    }

    .window-slot {
      width: 40px;
      height: 40px;
      background: #1e272e;
      border-radius: 9px;
      border: 2px solid #f1c40f;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
    }

    .animal-avatar {
      font-size: 1.5rem;
      position: absolute;
      bottom: -4px;
      transform: translateY(120%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .animal-avatar.visible {
      transform: translateY(0);
      animation: wave 0.8s ease-in-out infinite alternate;
    }

    @keyframes wave {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-4px) rotate(6deg); }
    }

    .curtain {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #d63031 0%, #b71540 100%);
      border-bottom: 4px solid #f8c291;
      transform: translateY(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .curtain.closed {
      transform: translateY(0%);
    }

    /* Modal / Menus */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 26, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .screen-overlay h1 {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 12px;
      text-shadow: 0 4px 15px rgba(253, 203, 110, 0.4);
    }

    .screen-overlay p {
      font-size: 1.1rem;
      max-width: 480px;
      color: #dcdde1;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .btn-play {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: #0f141d;
      font-size: 1.3rem;
      font-weight: 900;
      padding: 14px 44px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 184, 148, 0.4);
      transition: all 0.2s ease;
    }

    .btn-play:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 184, 148, 0.6);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="bg-park">
    <div class="stars"></div>
    <div class="ferris-wheel"></div>
  </div>

  <div class="hud">
    <div class="hud-card">مرحله: <span id="hud-level">1</span></div>
    <div class="hud-card">امتیاز: <span id="hud-score">0</span></div>
  </div>

  <div class="viewport">
    <div class="question-banner" id="status-text">آماده حرکت قطار باشید...</div>

    <div class="track-wrapper" id="track-wrapper">
      <svg class="rail-svg" id="rail-svg" preserveAspectRatio="none">
        <path class="rail-path-bg" id="rail-path-bg" d=""></path>
        <path class="rail-path-fg" id="rail-path-fg" d=""></path>
      </svg>
      <div class="train-container" id="train"></div>
    </div>
  </div>

  <!-- Start & Game Over Screen -->
  <div class="screen-overlay" id="menu-screen">
    <h1>پنجره‌های قطار شهربازی</h1>
    <p>چهره حیواناتی را که از پنجره‌های قطار به شما دست تکان می‌دهند به‌خاطر بسپارید و جایگاه آن‌ها را بازخوانی کنید!</p>
    <button class="btn-play" onclick="startGame()">شروع بازی</button>
  </div>
</div>

<script>
  // Web Audio API Sound Engine
  class AudioEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    playWhistle() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
      osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
      
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.5);
    }

    playSuccess() {
      if (!this.ctx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + i * 0.08);
        osc.stop(this.ctx.currentTime + i * 0.08 + 0.3);
      });
    }

    playError() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.4);
    }
  }

  const audio = new AudioEngine();

  const ANIMALS = [
    { name: 'شیر', icon: '🦁' },
    { name: 'پاندا', icon: '🐼' },
    { name: 'خرس', icon: '🐻' },
    { name: 'روباه', icon: '🦊' },
    { name: 'میمون', icon: '🐵' },
    { name: 'خرگوش', icon: '🐰' },
    { name: 'ببر', icon: '🐯' },
    { name: 'فیل', icon: '🐘' },
    { name: 'سگ', icon: '🐶' },
    { name: 'گربه', icon: '🐱' },
    { name: 'کوآلا', icon: '🐨' }
  ];

  let currentLevel = 1;
  let score = 0;
  let slots = [];
  let targetAnimal = null;
  let targetIndex = -1;
  let canInteract = false;

  function startGame() {
    audio.init();
    document.getElementById('menu-screen').classList.add('hidden');
    currentLevel = 1;
    score = 0;
    updateHUD();
    loadStage();
  }

  function updateHUD() {
    document.getElementById('hud-level').innerText = currentLevel;
    document.getElementById('hud-score').innerText = score;
  }

  function getLevelConfig(level) {
    const maxWindows = ANIMALS.length; // never exceed unique animals available
    if (level === 1) return { windows: 3, viewTime: 3200 };
    if (level === 2) return { windows: 4, viewTime: 2800 };
    if (level === 3) return { windows: 5, viewTime: 2400 };
    if (level === 4) return { windows: 6, viewTime: 2000 };
    return { windows: Math.min(3 + level, maxWindows), viewTime: 1800 };
  }

  function layoutCarriages() {
    const wrapper = document.getElementById('track-wrapper');
    const svg = document.getElementById('rail-svg');
    const pathBg = document.getElementById('rail-path-bg');
    const pathFg = document.getElementById('rail-path-fg');
    const W = wrapper.clientWidth;
    const H = wrapper.clientHeight;
    if (!W || !H) return;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const d = `M ${W*0.02} ${H*0.55} C ${W*0.18} ${H*0.05}, ${W*0.32} ${H*0.95}, ${W*0.5} ${H*0.5} ` +
              `C ${W*0.68} ${H*0.05}, ${W*0.82} ${H*0.95}, ${W*0.98} ${H*0.5}`;
    pathBg.setAttribute('d', d);
    pathFg.setAttribute('d', d);

    const totalItems = 1 + slots.length;
    const length = pathBg.getTotalLength();
    if (!length) return;
    const margin = length * 0.07;
    const usable = length - margin * 2;

    // Shrink the whole train as levels progress, and further when many carriages are on screen
    const itemsScale = totalItems <= 6 ? 1 : Math.max(0.5, 6 / totalItems);
    const levelScale = Math.max(0.45, 1 - (currentLevel - 1) * 0.06);
    const scale = Math.min(itemsScale, levelScale);

    const orderedCarriages = [];
    for (let i = 0; i < slots.length; i++) {
      orderedCarriages.push(document.querySelector(`.carriage[data-index="${i}"]`));
    }
    const ordered = [document.querySelector('.locomotive'), ...orderedCarriages];

    ordered.forEach((el, idx) => {
      if (!el) return;
      const t = totalItems === 1 ? margin : margin + idx * (usable / (totalItems - 1));
      const pt = pathBg.getPointAtLength(t);
      const pt2 = pathBg.getPointAtLength(Math.min(length, t + 1));
      let angle = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180 / Math.PI;
      angle = Math.max(-18, Math.min(18, angle));
      el.style.left = pt.x + 'px';
      el.style.top = pt.y + 'px';
      el.style.transform = `translate(-50%, -88%) rotate(${angle}deg) scale(${scale})`;
    });
  }

  window.addEventListener('resize', () => {
    if (slots.length) layoutCarriages();
  });

  function loadStage() {
    canInteract = false;
    const config = getLevelConfig(currentLevel);
    const trainEl = document.getElementById('train');
    const banner = document.getElementById('status-text');
    
    trainEl.innerHTML = '';
    trainEl.style.transition = 'none';
    trainEl.style.transform = 'translateX(500px)';
    banner.innerText = 'قطار در حال ورود به ایستگاه...';

    // Build Locomotive + Carriages
    const loco = document.createElement('div');
    loco.className = 'locomotive';
    loco.innerHTML = '<div class="chimney"></div><div class="carriage-wheels"><div class="wheel"></div><div class="wheel"></div></div>';
    trainEl.appendChild(loco);

    // Pick random, non-repeating animals for available windows
    const shuffledAnimals = [...ANIMALS].sort(() => 0.5 - Math.random());
    slots = [];

    for (let i = 0; i < config.windows; i++) {
      const animal = shuffledAnimals[i];
      slots.push(animal);

      const carriage = document.createElement('div');
      carriage.className = 'carriage';
      carriage.dataset.index = i;
      carriage.innerHTML = `
        <div class="window-slot">
          <div class="curtain" id="curtain-${i}"></div>
          <div class="animal-avatar" id="animal-${i}">${animal.icon}</div>
        </div>
        <div class="carriage-wheels">
          <div class="wheel"></div>
          <div class="wheel"></div>
        </div>
      `;
      carriage.onclick = () => handleCarriageClick(i);
      trainEl.appendChild(carriage);
    }

    // Position everything along the curved track
    layoutCarriages();

    // Pick Target Animal to find later
    targetIndex = Math.floor(Math.random() * config.windows);
    targetAnimal = slots[targetIndex];

    // Train Enters
    requestAnimationFrame(() => {
      trainEl.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
      setTimeout(() => {
        audio.playWhistle();
        trainEl.style.transform = 'translateX(0px)';
      }, 100);
    });

    // Reveal Animals
    setTimeout(() => {
      banner.innerText = 'خوب پنجره‌ها و حیوانات را تماشا کنید!';
      for (let i = 0; i < config.windows; i++) {
        document.getElementById(`animal-${i}`).classList.add('visible');
      }
    }, 900);

    // Hide Animals & Close Curtains
    setTimeout(() => {
      banner.innerText = 'پنجره‌ها بسته شدند... موقعیت‌ها را به خاطر آورید!';
      for (let i = 0; i < config.windows; i++) {
        document.getElementById(`curtain-${i}`).classList.add('closed');
      }
    }, 900 + config.viewTime);

    // Query Phase
    setTimeout(() => {
      banner.innerText = `حیوان «${targetAnimal.name}» ${targetAnimal.icon} در کدام واگن بود؟`;
      document.querySelectorAll('.carriage').forEach(c => c.classList.add('clickable'));
      canInteract = true;
    }, 900 + config.viewTime + 600);
  }

  function handleCarriageClick(index) {
    if (!canInteract) return;
    canInteract = false;

    // Open clicked curtain
    document.getElementById(`curtain-${index}`).classList.remove('closed');

    if (index === targetIndex) {
      audio.playSuccess();
      score += 10 * currentLevel;
      document.getElementById('status-text').innerText = 'آفرین! پاسخت کاملاً درست بود 🎉';
      updateHUD();

      setTimeout(() => {
        currentLevel++;
        loadStage();
      }, 1600);
    } else {
      audio.playError();
      document.getElementById(`curtain-${targetIndex}`).classList.remove('closed');
      document.getElementById('status-text').innerText = `اشتباه بود! ${targetAnimal.name} در این واگن بود.`;

      setTimeout(() => {
        showGameOver();
      }, 2200);
    }
  }

  function showGameOver() {
    const overlay = document.getElementById('menu-screen');
    overlay.innerHTML = `
      <h1>بازی تمام شد!</h1>
      <p>شما تا مرحله <strong>${currentLevel}</strong> پیش رفتید.<br>امتیاز نهایی شما: <strong>${score}</strong></p>
      <button class="btn-play" onclick="startGame()">تلاش مجدد</button>
    `;
    overlay.classList.remove('hidden');
  }
</script>

</body>
</html>
