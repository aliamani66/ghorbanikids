<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ترتیب چراغ‌های راهنمایی | Traffic Light Memo 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030712;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            padding: 10px 22px;
            color: #f8fafc;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        #instruction {
            position: absolute;
            bottom: 125px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 32px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.98) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 36px 44px;
            text-align: center;
            color: #fff;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }
        .card h1 {
            font-size: 2.2rem;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #ef4444, #eab308, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            outline: none;
            padding: 14px 44px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 14px 30px rgba(34, 197, 94, 0.6);
        }
        .btn:active {
            transform: scale(0.97);
        }
        #interactive-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 10;
        }
        .light-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .light-btn:active {
            transform: scale(0.92);
        }
        .light-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #ffffffaa;
        }
        .hidden {
            display: none !important;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div id="hud">
        <div class="glass-panel">مرحله: <span id="level-display">۱</span></div>
        <div class="glass-panel">امتیاز: <span id="score-display">۰</span></div>
    </div>

    <div id="instruction">آماده باشید...</div>

    <div id="start-screen" class="overlay-screen">
        <div class="card">
            <h1>چراغ راهنمایی فانتزی</h1>
            <p>چراغ‌های رنگی با ترتیب خاصی روشن و چشمک می‌زنند. توالی روشن شدن چراغ‌ها را با دقت به خاطر بسپارید و دقیقاً به همان ترتیب روی آن‌ها کلیک کنید!</p>
            <button class="btn" id="start-btn">شروع بازی</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay-screen hidden">
        <div class="card">
            <h1>توالی قطع شد!</h1>
            <p>امتیاز نهایی شما: <span id="final-score" style="font-weight:bold; color:#eab308;">0</span></p>
            <button class="btn" id="restart-btn">تلاش دوباره</button>
        </div>
    </div>

    <div id="interactive-panel" class="hidden">
        <button class="light-btn" id="btn-0" style="border-color: #ef4444;">
            <span class="light-dot" style="background:#ef4444; box-shadow: 0 0 10px #ef4444;"></span> قرمز
        </button>
        <button class="light-btn" id="btn-1" style="border-color: #eab308;">
            <span class="light-dot" style="background:#eab308; box-shadow: 0 0 10px #eab308;"></span> زرد
        </button>
        <button class="light-btn" id="btn-2" style="border-color: #22c55e;">
            <span class="light-dot" style="background:#22c55e; box-shadow: 0 0 10px #22c55e;"></span> سبز
        </button>
    </div>

    <div id="canvas-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(index) {
                if (!this.ctx) return;
                const freqs = [329.63, 440.00, 587.33];
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freqs[index], this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
            playSuccess() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
                });
            }
            playWrong() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sound = new SoundFX();

        let scene, camera, renderer;
        let trafficGroup;
        let lenses = [];
        let pointLights = [];
        let particles;
        let raycaster, mouse;

        let sequence = [];
        let playerStep = 0;
        let isPlayerTurn = false;
        let level = 1;
        let score = 0;

        const LIGHT_CONFIGS = [
            { id: 0, name: 'قرمز', color: 0xef4444, glow: 0xff1111, y: 1.45 },
            { id: 1, name: 'زرد',  color: 0xeab308, glow: 0xffcc00, y: 0.0 },
            { id: 2, name: 'سبز',  color: 0x22c55e, glow: 0x00ff66, y: -1.45 }
        ];

        function initScene() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.035);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 9);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.7);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 8, 8);
            dirLight.castShadow = true;
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            buildTrafficLight();
            createAmbientSparks();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointerdown', onCanvasClick);
        }

        function buildTrafficLight() {
            trafficGroup = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.25,
                metalness: 0.8
            });
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.4,
                metalness: 0.5
            });

            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(2.3, 5.0, 1.4), bodyMat);
            mainBody.castShadow = true;
            trafficGroup.add(mainBody);

            [-2.5, 2.5].forEach(y => {
                const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.3, 32), frameMat);
                cap.position.y = y;
                trafficGroup.add(cap);
            });

            const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.3 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 6, 24), poleMat);
            pole.position.y = -4.5;
            trafficGroup.add(pole);

            LIGHT_CONFIGS.forEach((cfg) => {
                const bezelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.7 });
                const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.68, 0.08, 16, 32), bezelMat);
                bezel.position.set(0, cfg.y, 0.7);
                trafficGroup.add(bezel);

                const lensMat = new THREE.MeshStandardMaterial({
                    color: cfg.color,
                    emissive: cfg.color,
                    emissiveIntensity: 0.08,
                    roughness: 0.1,
                    metalness: 0.2,
                    transparent: true,
                    opacity: 0.92
                });

                const lens = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 16), lensMat);
                lens.position.set(0, cfg.y, 0.62);
                lens.scale.set(1, 1, 0.35);
                lens.userData = { config: cfg, id: cfg.id };
                trafficGroup.add(lens);
                lenses.push(lens);

                const pLight = new THREE.PointLight(cfg.glow, 0, 5);
                pLight.position.set(0, cfg.y, 1.2);
                trafficGroup.add(pLight);
                pointLights.push(pLight);
            });

            scene.add(trafficGroup);
        }

        function createAmbientSparks() {
            const count = 120;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 16;
                positions[i + 1] = (Math.random() - 0.5) * 12;
                positions[i + 2] = (Math.random() - 0.5) * 8;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ size: 0.04, color: 0x38bdf8, transparent: true, opacity: 0.6 });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);
        }

        function activateLight(index, duration = 400) {
            return new Promise(resolve => {
                const lens = lenses[index];
                const pLight = pointLights[index];
                
                sound.playTone(index);

                new TWEEN.Tween(lens.material)
                    .to({ emissiveIntensity: 2.2 }, duration * 0.4)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .yoyo(true)
                    .repeat(1)
                    .start();

                new TWEEN.Tween(pLight)
                    .to({ intensity: 2.5 }, duration * 0.4)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .yoyo(true)
                    .repeat(1)
                    .start();

                new TWEEN.Tween(lens.scale)
                    .to({ x: 1.15, y: 1.15, z: 0.45 }, duration * 0.4)
                    .easing(TWEEN.Easing.Back.Out)
                    .yoyo(true)
                    .repeat(1)
                    .onComplete(() => {
                        lens.material.emissiveIntensity = 0.08;
                        pLight.intensity = 0;
                        lens.scale.set(1, 1, 0.35);
                        resolve();
                    })
                    .start();
            });
        }

        async function playSequence() {
            isPlayerTurn = false;
            document.getElementById('interactive-panel').classList.add('hidden');
            document.getElementById('instruction').innerText = "خوب دقت کنید...";

            const speed = Math.max(260, 600 - (level * 35));
            const pause = Math.max(160, 320 - (level * 18));

            await new Promise(r => setTimeout(r, 600));

            for (let i = 0; i < sequence.length; i++) {
                await activateLight(sequence[i], speed);
                await new Promise(r => setTimeout(r, pause));
            }

            playerStep = 0;
            isPlayerTurn = true;
            document.getElementById('instruction').innerText = "حالا نوبت شماست! تکرار کنید:";
            document.getElementById('interactive-panel').classList.remove('hidden');
        }

        function startNewRound() {
            const targetLength = 2 + level;
            sequence = [];
            for (let i = 0; i < targetLength; i++) {
                sequence.push(Math.floor(Math.random() * 3));
            }
            playSequence();
        }

        function handleInput(colorIndex) {
            if (!isPlayerTurn) return;

            activateLight(colorIndex, 250);

            if (colorIndex === sequence[playerStep]) {
                playerStep++;

                if (playerStep >= sequence.length) {
                    isPlayerTurn = false;
                    document.getElementById('interactive-panel').classList.add('hidden');
                    sound.playSuccess();
                    score += 100 + (level * 40);
                    level++;
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('level-display').innerText = level;
                    document.getElementById('instruction').innerText = "عالی بود! آفرین 🎉";

                    new TWEEN.Tween(trafficGroup.rotation)
                        .to({ y: Math.PI * 2 }, 800)
                        .easing(TWEEN.Easing.Back.Out)
                        .onComplete(() => {
                            trafficGroup.rotation.y = 0;
                            setTimeout(startNewRound, 600);
                        })
                        .start();
                }
            } else {
                isPlayerTurn = false;
                sound.playWrong();
                document.getElementById('interactive-panel').classList.add('hidden');
                document.getElementById('instruction').innerText = "اشتباه شد! ❌";

                new TWEEN.Tween(trafficGroup.position)
                    .to({ x: 0.35 }, 50)
                    .repeat(7)
                    .yoyo(true)
                    .onComplete(() => {
                        trafficGroup.position.x = 0;
                        document.getElementById('final-score').innerText = score;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    })
                    .start();
            }
        }

        function onCanvasClick(event) {
            if (!isPlayerTurn) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(lenses);

            if (intersects.length > 0) {
                const clickedLens = intersects[0].object;
                handleInput(clickedLens.userData.id);
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            const time = clock.getElapsedTime();

            if (particles) {
                particles.rotation.y = time * 0.03;
            }

            if (trafficGroup) {
                trafficGroup.position.y = Math.sin(time * 1.5) * 0.08;
                if (isPlayerTurn) {
                    trafficGroup.rotation.y = Math.sin(time * 2) * 0.08;
                }
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        document.getElementById('btn-0').addEventListener('click', () => handleInput(0));
        document.getElementById('btn-1').addEventListener('click', () => handleInput(1));
        document.getElementById('btn-2').addEventListener('click', () => handleInput(2));

        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            document.getElementById('start-screen').classList.add('hidden');
            score = 0;
            level = 1;
            document.getElementById('score-display').innerText = score;
            document.getElementById('level-display').innerText = level;
            startNewRound();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0;
            level = 1;
            document.getElementById('score-display').innerText = score;
            document.getElementById('level-display').innerText = level;
            startNewRound();
        });

        window.onload = () => {
            initScene();
            animate();
        };
    </script>
</body>
</html>
