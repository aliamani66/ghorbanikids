<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کلید و قفل کلمات</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #2b1055 0%, #0d001a 100%);
      padding: 16px;
      color: #fff;
      touch-action: manipulation;
    }

    .game-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 450px;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .score-badge {
      background: #facc15;
      color: #713f12;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .chest-area {
      position: relative;
      margin: 10px 0 20px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 24px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }

    .chest-graphic {
      font-size: 4rem;
      line-height: 1;
      display: inline-block;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chest-graphic.opened {
      transform: scale(1.15) rotate(-5deg);
    }
    .chest-graphic.failed {
      transform: scale(0.95) rotate(4deg);
      filter: grayscale(0.5);
    }

    /* سرنخ تصویری و صوتی به‌جای نوشتن مستقیم کلمه */
    .clue-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .clue-title {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: bold;
    }
    .clue-emoji {
      font-size: 3.4rem;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }
    .hear-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #075985;
    }
    .hear-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #075985; }

    .keyhole-zone {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 16px 0 10px;
      direction: rtl;
      flex-wrap: wrap;
    }

    .lock-slot {
      width: 48px;
      height: 56px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px dashed rgba(250, 204, 21, 0.45);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fde047;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .lock-slot.active-slot {
      border: 2px solid #facc15;
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.25), inset 0 2px 5px rgba(0,0,0,0.3);
    }

    .lock-slot.drag-over {
      background: rgba(250, 204, 21, 0.3);
      transform: scale(1.1);
    }

    .lock-slot.unlocked {
      background: #22c55e;
      border: 2px solid #15803d;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
    }

    .lock-slot.revealed {
      background: #ef4444;
      border: 2px solid #b91c1c;
      color: #fff;
    }

    .lock-slot.shake {
      animation: shakeSlot 0.35s ease;
    }
    @keyframes shakeSlot {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .keys-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .keys-rack {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      min-height: 70px;
      margin-bottom: 14px;
      position: relative;
    }

    .key-item {
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%);
      color: #422006;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      cursor: grab;
      box-shadow: 0 5px 0 #854d0e, 0 8px 15px rgba(0, 0, 0, 0.3);
      border: 2px solid #fef9c3;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.15s;
      touch-action: none;
      position: relative;
    }

    .key-item.dragging {
      position: fixed;
      z-index: 999;
      pointer-events: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      transform: scale(1.1) rotate(-4deg);
    }

    .key-item.used {
      opacity: 0.2;
      pointer-events: none;
    }

    .status-text {
      font-size: 1.05rem;
      font-weight: bold;
      min-height: 28px;
      margin-top: 8px;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .end-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 0, 25, 0.95);
      border-radius: 32px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      z-index: 50;
    }
    .end-overlay.show { display: flex; }
    .end-overlay h2 { margin: 0; font-size: 1.6rem; color: #fde047; }
    .end-overlay p { margin: 0; font-size: 1.1rem; }
    .play-again-btn {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #15803d;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="end-overlay" id="end-overlay">
    <h2>🎉 همه صندوق‌ها تموم شد! 🎉</h2>
    <p>الماس‌های تو: <span id="final-score">۰</span> 💎</p>
    <button class="play-again-btn" id="play-again-btn">دوباره بازی کن</button>
  </div>

  <div class="top-bar">
    <span>صندوق: <span id="stage-num">۱</span> از <span id="stage-total">۲۰</span></span>
    <button class="btn-reset" id="reset-btn">شروع دوباره ↺</button>
    <div class="score-badge">الماس: <span id="score-val">۰</span> 💎</div>
  </div>

  <div class="chest-area">
    <div class="chest-graphic" id="chest-icon">🔒📦</div>

    <div class="clue-box">
      <div class="clue-title">این چیه؟ حروفش رو پیدا کن!</div>
      <div class="clue-emoji" id="clue-emoji">💨</div>
      <button class="hear-btn" id="hear-btn">🔊 بشنو</button>
    </div>

    <div class="keyhole-zone" id="slots-zone"></div>
  </div>

  <div class="keys-title" id="keys-title">دو فرصت داری، درست انتخاب کن:</div>
  <div class="keys-rack" id="keys-rack"></div>

  <div class="status-text" id="status-text"></div>
</div>

<script>
  // ۲۰ کلمه؛ به‌جای نوشتن مستقیم کلمه، فقط یک شکلک (سرنخ تصویری) و صدای تلفظ نشان داده می‌شود
  const stages = [
    { word: "باد", emoji: "💨", distractors: ["ر", "م"] },
    { word: "آب", emoji: "💧", distractors: ["س", "ت"] },
    { word: "نان", emoji: "🍞", distractors: ["د", "ز"] },
    { word: "دست", emoji: "✋", distractors: ["ک", "ب"] },
    { word: "سبز", emoji: "🟢", distractors: ["ش", "و"] },
    { word: "ماه", emoji: "🌙", distractors: ["ت", "ل"] },
    { word: "سیب", emoji: "🍎", distractors: ["ن", "ک"] },
    { word: "توپ", emoji: "⚽", distractors: ["ر", "ن"] },
    { word: "مار", emoji: "🐍", distractors: ["ت", "ل"] },
    { word: "گاو", emoji: "🐄", distractors: ["ن", "س"] },
    { word: "شیر", emoji: "🦁", distractors: ["م", "پ"] },
    { word: "گل", emoji: "🌸", distractors: ["ب", "ت"] },
    { word: "برگ", emoji: "🍂", distractors: ["س", "م"] },
    { word: "ستاره", emoji: "⭐", distractors: ["ک", "ل"] },
    { word: "خرس", emoji: "🐻", distractors: ["پ", "ن"] },
    { word: "پروانه", emoji: "🦋", distractors: ["س", "د"] },
    { word: "خانه", emoji: "🏠", distractors: ["ت", "ب"] },
    { word: "کتاب", emoji: "📖", distractors: ["م", "ش"] },
    { word: "مداد", emoji: "✏️", distractors: ["ن", "س"] },
    { word: "توت", emoji: "🍓", distractors: ["ب", "ک"] }
  ];

  // حروفی که به حرف بعدشان نمی‌چسبند
  const NONJOIN = new Set(["ا", "آ", "د", "ذ", "ر", "ز", "ژ", "و"]);

  // شکل واقعی هر حرف را بر اساس جایگاهش در کلمه می‌سازد (اول/وسط/آخر کلمه)
  function buildKeys(word) {
    const letters = Array.from(word);
    return letters.map((ch, i) => {
      const joinsFromPrev = i > 0 && !NONJOIN.has(letters[i - 1]);
      const joinsToNext = i < letters.length - 1 && !NONJOIN.has(ch);
      return (joinsFromPrev ? "ـ" : "") + ch + (joinsToNext ? "ـ" : "");
    });
  }

  // برای اینکه شکل کلیدهای تله (اشتباهی) لو ندهد کدام‌ها درستند، شکلی تصادفی و معتبر به آن‌ها می‌دهیم
  function decorateDistractor(ch) {
    const canJoinNext = !NONJOIN.has(ch);
    const styles = canJoinNext ? ["plain", "final", "initial", "medial"] : ["plain", "final"];
    const style = styles[Math.floor(Math.random() * styles.length)];
    if (style === "final") return "ـ" + ch;
    if (style === "initial") return ch + "ـ";
    if (style === "medial") return "ـ" + ch + "ـ";
    return ch;
  }

  const MAX_MISTAKES = 2;
  let currentStageIdx = 0;
  let score = 0;
  let enteredKeys = [];
  let stageFailed = false;
  let mistakesLeft = MAX_MISTAKES;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playKeyClickSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playWrongSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playChestOpenSound() {
    [392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (idx + 1) * 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.08);
      osc.stop(audioCtx.currentTime + (idx + 1) * 0.15);
    });
  }

  function speakWord(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fa-IR';
      u.rate = 0.8;
      window.speechSynthesis.speak(u);
    }
  }

  const chestIcon = document.getElementById("chest-icon");
  const clueEmoji = document.getElementById("clue-emoji");
  const hearBtn = document.getElementById("hear-btn");
  const slotsZone = document.getElementById("slots-zone");
  const keysRack = document.getElementById("keys-rack");
  const statusText = document.getElementById("status-text");
  const scoreVal = document.getElementById("score-val");
  const stageNum = document.getElementById("stage-num");
  const stageTotal = document.getElementById("stage-total");
  const resetBtn = document.getElementById("reset-btn");
  const endOverlay = document.getElementById("end-overlay");
  const finalScoreEl = document.getElementById("final-score");
  const playAgainBtn = document.getElementById("play-again-btn");

  stageTotal.textContent = stages.length.toLocaleString('fa-IR');

  function highlightActiveSlot() {
    document.querySelectorAll(".lock-slot").forEach((slot, i) => {
      slot.classList.toggle("active-slot", i === enteredKeys.length && !slot.classList.contains("unlocked") && !stageFailed);
    });
  }

  function setupStage() {
    const stage = stages[currentStageIdx];
    const realKeys = buildKeys(stage.word);
    enteredKeys = [];
    stageFailed = false;
    mistakesLeft = MAX_MISTAKES;
    document.getElementById("keys-title").textContent = `${mistakesLeft.toLocaleString('fa-IR')} فرصت داری، درست انتخاب کن:`;

    chestIcon.textContent = "🔒📦";
    chestIcon.classList.remove("opened", "failed");
    clueEmoji.textContent = stage.emoji;
    stageNum.textContent = (currentStageIdx + 1).toLocaleString('fa-IR');
    statusText.textContent = "";

    slotsZone.innerHTML = "";
    Array.from(stage.word).forEach((_, i) => {
      const slot = document.createElement("div");
      slot.className = "lock-slot";
      slot.id = `slot-${i}`;
      slot.textContent = "؟";
      slotsZone.appendChild(slot);
    });
    highlightActiveSlot();

    const distractorTiles = stage.distractors.map(decorateDistractor);
    const allTiles = [...realKeys, ...distractorTiles]
      .map((display, idx) => ({ display, real: idx < realKeys.length }))
      .sort(() => Math.random() - 0.5);

    keysRack.innerHTML = "";
    allTiles.forEach((tile) => {
      const keyBtn = document.createElement("div");
      keyBtn.className = "key-item";
      keyBtn.textContent = tile.display;
      attachKeyInteraction(keyBtn, tile.display, realKeys);
      keysRack.appendChild(keyBtn);
    });
  }

  function attachKeyInteraction(keyBtn, display, realKeys) {
    let startX = 0, startY = 0, moved = false, dragging = false;

    keyBtn.addEventListener("pointerdown", (e) => {
      if (keyBtn.classList.contains("used") || stageFailed) return;
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
      dragging = false;
      keyBtn.setPointerCapture(e.pointerId);
    });

    keyBtn.addEventListener("pointermove", (e) => {
      if (keyBtn.classList.contains("used") || stageFailed) return;
      if (!keyBtn.hasPointerCapture(e.pointerId)) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!dragging && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        dragging = true;
        moved = true;
        keyBtn.classList.add("dragging");
      }
      if (dragging) {
        keyBtn.style.left = `${e.clientX - 27}px`;
        keyBtn.style.top = `${e.clientY - 27}px`;

        const activeSlot = document.querySelector(".lock-slot.active-slot");
        document.querySelectorAll(".lock-slot").forEach(s => s.classList.remove("drag-over"));
        if (activeSlot) {
          const r = activeSlot.getBoundingClientRect();
          if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
            activeSlot.classList.add("drag-over");
          }
        }
      }
    });

    keyBtn.addEventListener("pointerup", (e) => {
      if (keyBtn.classList.contains("used") || stageFailed) return;
      keyBtn.releasePointerCapture(e.pointerId);
      document.querySelectorAll(".lock-slot").forEach(s => s.classList.remove("drag-over"));

      if (!moved) {
        handleKeySelection(display, keyBtn, realKeys);
      } else {
        keyBtn.classList.remove("dragging");
        keyBtn.style.left = "";
        keyBtn.style.top = "";
        const activeSlot = document.querySelector(".lock-slot.active-slot");
        if (activeSlot) {
          const r = activeSlot.getBoundingClientRect();
          if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
            handleKeySelection(display, keyBtn, realKeys);
            return;
          }
        }
      }
    });

    keyBtn.addEventListener("pointercancel", () => {
      keyBtn.classList.remove("dragging");
      keyBtn.style.left = "";
      keyBtn.style.top = "";
      document.querySelectorAll(".lock-slot").forEach(s => s.classList.remove("drag-over"));
    });
  }

  function handleKeySelection(display, sourceEl, realKeys) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (stageFailed) return;
    const nextSlotIndex = enteredKeys.length;
    if (nextSlotIndex >= realKeys.length) return;

    if (display === realKeys[nextSlotIndex]) {
      playKeyClickSound();
      enteredKeys.push(display);

      const slot = document.getElementById(`slot-${nextSlotIndex}`);
      slot.textContent = display.replace(/ـ/g, "");
      slot.classList.add("unlocked");
      slot.classList.remove("active-slot");

      if (sourceEl) sourceEl.classList.add("used");

      if (enteredKeys.length === realKeys.length) {
        unlockChest();
      } else {
        highlightActiveSlot();
      }
    } else {
      registerMistake(realKeys, sourceEl);
    }
  }

  function registerMistake(realKeys, sourceEl) {
    playWrongSound();
    mistakesLeft--;

    const activeSlot = document.querySelector(".lock-slot.active-slot");
    if (activeSlot) {
      activeSlot.classList.add("shake");
      setTimeout(() => activeSlot.classList.remove("shake"), 350);
    }
    if (sourceEl) {
      sourceEl.style.transform = "scale(0.9)";
      setTimeout(() => { sourceEl.style.transform = ""; }, 150);
    }

    if (mistakesLeft > 0) {
      statusText.style.color = "#fbbf24";
      statusText.textContent = `کلید اشتباه بود! ${mistakesLeft.toLocaleString('fa-IR')} فرصت دیگه داری.`;
      document.getElementById("keys-title").textContent = `${mistakesLeft.toLocaleString('fa-IR')} فرصت داری، درست انتخاب کن:`;
    } else {
      failStage(realKeys);
    }
  }

  function failStage(realKeys) {
    stageFailed = true;
    const stage = stages[currentStageIdx];

    // فرصت تمام شد: پاسخ درست نشان داده می‌شود ولی الماسی داده نمی‌شود
    Array.from(stage.word).forEach((letter, i) => {
      const slot = document.getElementById(`slot-${i}`);
      slot.textContent = letter;
      slot.classList.remove("active-slot", "unlocked");
      slot.classList.add("revealed");
    });

    document.querySelectorAll(".key-item").forEach(k => k.classList.add("used"));
    chestIcon.textContent = "😢📦";
    chestIcon.classList.add("failed");

    statusText.style.color = "#f87171";
    statusText.textContent = `فرصتت تموم شد! کلمه درست: «${stage.word}» بود.`;
    speakWord(stage.word);

    setTimeout(goToNextStage, 2400);
  }

  function unlockChest() {
    const stage = stages[currentStageIdx];
    chestIcon.textContent = "🔓✨💎";
    chestIcon.classList.add("opened");
    playChestOpenSound();
    speakWord(stage.word);

    score += 25;
    scoreVal.textContent = score.toLocaleString('fa-IR');
    statusText.style.color = "#4ade80";
    statusText.textContent = `قفل باز شد! کلمه «${stage.word}» ساخته شد 🎉`;

    setTimeout(goToNextStage, 2000);
  }

  function goToNextStage() {
    currentStageIdx++;
    if (currentStageIdx >= stages.length) {
      showEndScreen();
    } else {
      setupStage();
    }
  }

  function showEndScreen() {
    finalScoreEl.textContent = score.toLocaleString('fa-IR');
    endOverlay.classList.add("show");
  }

  function restartGame() {
    currentStageIdx = 0;
    score = 0;
    scoreVal.textContent = score.toLocaleString('fa-IR');
    endOverlay.classList.remove("show");
    setupStage();
  }

  hearBtn.onclick = () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    speakWord(stages[currentStageIdx].word);
  };
  resetBtn.onclick = restartGame;
  playAgainBtn.onclick = restartGame;

  setupStage();
</script>

</body>
</html>
