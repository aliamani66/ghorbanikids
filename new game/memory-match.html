<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی تطبیق کارت‌ها | Memory Match</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1f1c2c, #928dab);
      --card-back: linear-gradient(135deg, #6a11cb, #2575fc);
      --accent-color: #ff007f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
    }

    /* Start Screen */
    .start-screen h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      animation: pulse 2s infinite alternate;
    }

    .btn {
      padding: 15px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 30px rgba(255, 0, 127, 0.4);
    }

    /* Game HUD */
    .hud {
      display: flex;
      gap: 30px;
      font-size: 1.2rem;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      gap: 15px;
      perspective: 1000px;
    }

    /* Card Styling & 3D Animations */
    .card {
      width: 90px;
      height: 110px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg) scale(1.08);
      animation: matchGlow 0.8s ease-in-out forwards;
      z-index: 2;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }

    .card-front {
      background: var(--card-back);
      border: 2px solid rgba(255,255,255,0.2);
    }

    .card-front::after {
      content: "❓";
      font-size: 1.5rem;
      opacity: 0.7;
    }

    .card-back {
      background: rgba(255, 255, 255, 0.9);
      transform: rotateY(180deg);
    }

    /* Animations */
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    @keyframes matchGlow {
      0% { box-shadow: 0 0 0px #00ff88; }
      50% { box-shadow: 0 0 25px #00ff88; }
      100% { box-shadow: 0 0 8px #00ff88; opacity: 1; }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-10px); }
      40% { transform: rotateY(180deg) translateX(10px); }
      60% { transform: rotateY(180deg) translateX(-10px); }
      80% { transform: rotateY(180deg) translateX(10px); }
    }
  </style>
</head>
<body>

  <!-- صفحه شروع -->
  <div id="start-screen" class="screen start-screen">
    <h1>تطبیق کارت‌ها 🧩</h1>
    <button class="btn" onclick="startGame()">شروع بازی</button>
  </div>

  <!-- صفحه اصلی بازی -->
  <div id="game-screen" class="screen hidden">
    <div class="hud">
      <div>مرحله: <span id="level-txt">۱</span></div>
      <div>امتیاز: <span id="score-txt">۰</span></div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    // صداهای مصنوعی با Web Audio API (بدون نیاز به فایل خارجی)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flip') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'match') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    // تنظیمات مراحل
    const items = ['🍎', '🍌', '🍓', '🍇', '🐶', '🐱', '🦊', '🦁', '🐼', '🐸', '🐵', '🦉'];
    const levels = [
      { level: 1, rows: 2, cols: 3 }, // ۲×۳ (۳ جفت)
      { level: 2, rows: 2, cols: 4 }, // ۲×۴ (۴ جفت)
      { level: 3, rows: 3, cols: 4 }, // ۳×۴ (۶ جفت)
      { level: 4, rows: 4, cols: 4 }  // ۴×۴ (۸ جفت)
    ];

    let currentLevelIdx = 0;
    let score = 0;
    let flippedCards = [];
    let isBoardLocked = false;
    let matchedPairs = 0;

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      currentLevelIdx = 0;
      score = 0;
      updateHUD();
      loadLevel();
    }

    function updateHUD() {
      document.getElementById('level-txt').innerText = currentLevelIdx + 1;
      document.getElementById('score-txt').innerText = score;
    }

    function loadLevel() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      isBoardLocked = true; // در حین نمایش اولیه، کلیک روی کارت‌ها غیرفعال است

      const config = levels[currentLevelIdx];
      grid.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;

      const totalPairs = (config.rows * config.cols) / 2;
      const levelItems = items.slice(0, totalPairs);
      const deck = [...levelItems, ...levelItems].sort(() => Math.random() - 0.5);

      deck.forEach(symbol => {
        const card = document.createElement('div');
        card.className = 'card'; // ابتدا پشت کارت (بسته) نمایش داده می‌شود
        card.dataset.symbol = symbol;

        card.innerHTML = `
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${symbol}</div>
        `;

        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });

      // کمی بعد از رندر شدن پشت کارت‌ها، همه را با انیمیشن چرخش رو می‌کنیم
      requestAnimationFrame(() => {
        setTimeout(() => {
          document.querySelectorAll('.card').forEach(card => card.classList.add('flipped'));
        }, 300);
      });

      // مدت نمایش اولیه: کمی بیشتر برای مراحل بزرگ‌تر
      const peekDuration = 1800 + totalPairs * 300;
      setTimeout(() => {
        document.querySelectorAll('.card').forEach(card => card.classList.remove('flipped'));
        isBoardLocked = false;
      }, peekDuration);
    }

    function flipCard(card) {
      if (isBoardLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      playSound('flip');
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      isBoardLocked = true;
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.symbol === card2.dataset.symbol;

      if (isMatch) {
        setTimeout(() => {
          playSound('match');
          card1.classList.add('matched');
          card2.classList.add('matched');
          score += 10;
          matchedPairs++;
          updateHUD();
          flippedCards = [];
          isBoardLocked = false;

          const config = levels[currentLevelIdx];
          if (matchedPairs === (config.rows * config.cols) / 2) {
            setTimeout(nextLevel, 1000);
          }
        }, 400);
      } else {
        setTimeout(() => {
          playSound('wrong');
          card1.classList.add('shake');
          card2.classList.add('shake');
        }, 400);

        setTimeout(() => {
          card1.classList.remove('flipped', 'shake');
          card2.classList.remove('flipped', 'shake');
          flippedCards = [];
          isBoardLocked = false;
        }, 1000);
      }
    }

    function nextLevel() {
      if (currentLevelIdx < levels.length - 1) {
        currentLevelIdx++;
        updateHUD();
        loadLevel();
      } else {
        // ارسال امتیاز بازی به سیستم قربانی کیدز
        if (window.parent) {
          window.parent.postMessage({
            type: 'GK_SUBMIT_SCORE',
            score: score
          }, '*');
        }
        alert(`تبریک! شما تمام مراحل را با امتیاز ${score} به پایان رساندید!`);
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
